<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8f5;--card:#fff;--ink:#14231b;--mut:#5b6b62;--line:#dfe6e0;--acc:#1b7a4b;--sun:#f2b705}
:root[data-theme="dark"]{--bg:#0e1612;--card:#16221b;--ink:#e8f0ea;--mut:#9db0a4;--line:#26362c;--acc:#4cc38a;--sun:#f2c94c;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--card:#16221b;--ink:#e8f0ea;--mut:#9db0a4;--line:#26362c;--acc:#4cc38a;--sun:#f2c94c;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
h1,h2,h3,.hd{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.mut{color:var(--mut)}
.btn{background:var(--acc);color:#fff;border-radius:10px;padding:.5rem .9rem;font-weight:600;border:0;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chip{border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;cursor:pointer;background:var(--card);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.4rem .6rem;max-width:100%}
.fiche ul{list-style:disc;padding-left:1.2rem;margin:.4rem 0}.fiche li{margin:.25rem 0}.fiche p{margin:.5rem 0;line-height:1.55}.fiche h4{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;color:var(--acc);margin:.9rem 0 .2rem}.fiche .tip{border-left:4px solid var(--sun);padding:.3rem .7rem;margin:.6rem 0;background:var(--bg);border-radius:6px}
.bk{border-left:5px solid var(--bc);background:color-mix(in srgb,var(--bc) 10%,transparent);border-radius:10px;padding:.4rem .8rem;margin:.8rem 0}.bk h4{margin-top:.2rem}.bkl{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--bc)}.bk-definition{--bc:#2b7de9}.bk-methode{--bc:#1b9a5a}.bk-exemple{--bc:#8a5cf6}.bk-attention{--bc:#d04545}.bk-memo{--bc:#d99a00}.bk-astuce{--bc:#e08a1e}
.tab{padding:.7rem .9rem;cursor:pointer;border:0;background:none;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--acc);border-color:var(--sun)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;margin:.35rem 0;background:var(--card);color:var(--ink);cursor:pointer}
.opt.ok{border-color:#1b9a5a;background:rgba(27,154,90,.18)}.opt.ko{border-color:#d04545;background:rgba(208,69,69,.18)}
.flip{perspective:900px}.flip>div{transition:transform .5s;transform-style:preserve-3d;position:relative;min-height:220px}
.flip.on>div{transform:rotateY(180deg)}

.back{transform:rotateY(180deg);background:var(--acc);color:#fff}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}

/* ===== Refonte : barre du bas + style ===== */
#tabs{display:none}
main{padding-bottom:6rem!important}
.card{box-shadow:0 1px 2px rgba(20,35,27,.06),0 8px 20px -12px rgba(20,35,27,.25)}
.btn{min-height:44px;transition:transform .15s,opacity .15s}.btn:active{transform:scale(.97)}
.chip{min-height:38px;display:inline-flex;align-items:center}

header{backdrop-filter:blur(8px)}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#bnav .in{max-width:56rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bi{background:none;border:0;color:var(--mut);padding:.5rem .1rem .4rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;font-size:.72rem;font-weight:600;cursor:pointer;min-height:56px}
.bi span{font-size:1.35rem;line-height:1.2}
.bi.on{color:var(--acc)}.bi.on span{transform:translateY(-1px)}
.bi.on::after{content:"";width:22px;height:3px;border-radius:3px;background:var(--sun);margin-top:2px}
#more{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
#more.open{display:flex}

#more .g{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.7rem}
#more .g button{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:.8rem .3rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:.85rem;min-height:72px}
#more .g button span{font-size:1.5rem}
#more .g button.on{border-color:var(--acc);color:var(--acc)}

.fiche{font-size:1.04rem}.fiche p,.fiche li{line-height:1.7}.fiche h4{margin-top:1.1rem}

/* ===== Motivation + Momo ===== */
.awa{display:flex;gap:.7rem;align-items:center;background:linear-gradient(135deg,var(--hg1),var(--hg2));color:#fff;border-radius:16px;padding:.7rem .9rem;margin-bottom:.7rem}.awa .mut{color:rgba(255,255,255,.85)}

.bub{display:flex;gap:.5rem;margin:.6rem 0;max-width:94%}.bub.me{margin-left:auto;background:var(--acc);color:var(--onacc);padding:.55rem .8rem;border-radius:16px 16px 4px 16px}

<body>
<header class="sticky z-20" style="top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--line)">
  <div class="max-w-4xl mx-auto flex items-center justify-between px-4 pt-2">
    <h1 class="hd text-xl font-bold" style="color:var(--acc)">Monbac <span class="mut text-sm font-normal">· Bac L2</span></h1>
    <button id="theme" class="chip" aria-label="Changer de thème">🌓</button>
  </div>

<script>
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const SUBJ={philo:["Philosophie",6],hg:["Histoire-Géographie",6],fr:["Français",5],en:["Anglais",4],eco:["Économie générale",3],maths:["Mathématiques",2],svt:["SVT / PC",2],eps:["EPS",1]};
const SK=["philo","hg","fr","eco","en","maths"];

/* ---------- Données ---------- */
const FICHES={
philo:[
["Le Sujet",`<ul><li><b>Conscience</b> : capacité de se saisir de soi et du monde. Descartes : le cogito, « Je pense, donc je suis ».</li><li><b>Inconscient</b> : Freud distingue le ça, le moi et le surmoi ; rêves, lapsus et actes manqués le révèlent.</li><li><b>Autrui</b> : Sartre, le regard d’autrui me fait exister comme objet (« l’enfer, c’est les autres »). Pour Diagne, l’identité se construit dans la traduction et la rencontre.</li></ul>`],
["Culture et société",`<ul><li><b>Langage</b> : outil de communication et de pensée.</li><li><b>Art</b> : pour Kant, est beau ce qui plaît universellement sans concept. En Afrique, l’art a aussi une fonction sacrée et communautaire.</li><li><b>Religion</b> : foi et révélation, face à la raison et au libre examen.</li><li><b>État</b> : Hobbes (sécurité, souverain absolu) ; Rousseau (volonté générale) ; Montesquieu (séparation des pouvoirs).</li><li><b>Droit et justice</b> : droit naturel (inaliénable) et droit positif (lois écrites). La justice rend à chacun son dû.</li></ul>`],
["La Connaissance",`<ul><li><b>Vérité</b> : Platon et le mythe de la caverne (passer de l’opinion au savoir).</li><li><b>Science</b> : Bachelard, la science s’oppose à l’opinion et progresse par rectification d’erreurs ; Popper, une théorie scientifique est réfutable.</li><li><b>Méthode expérimentale</b> (Claude Bernard) : Observation, Hypothèse, Expérience, Résultat, Interprétation, Conclusion (OHERIC).</li></ul>`],
["L’Existence et le Temps",`<ul><li><b>Liberté</b> : Sartre, « l’existence précède l’essence ». L’homme est condamné à être libre.</li><li><b>Devoir</b> : Kant, impératif catégorique ; agir par devoir et non par intérêt.</li><li><b>Bonheur</b> : plaisir (Épicure) ou vertu (stoïciens) ? Kant : le bonheur n’est pas un idéal de la raison.</li><li><b>Mort et temps</b> : conscience de sa finitude ; Nietzsche et l’éternel retour ; Marx, l’histoire comme lutte des classes.</li></ul>`],
["Méthode : dissertation",`<ul><li><b>Introduction</b> : amorce, sujet, problématique (paradoxe), annonce du plan.</li><li><b>Développement</b> : thèse, antithèse, synthèse. Chaque partie : idée, auteur ou citation, exemple, mini-conclusion.</li><li><b>Conclusion</b> : bilan, réponse nette, ouverture.</li><li><b>Commentaire de texte</b> : thème, thèse, structure logique, explication ligne à ligne, discussion et portée.</li></ul>`]],
hg:[
["Guerre froide (1947–1991)",`<ul><li>Bloc Est (URSS, Pacte de Varsovie) contre bloc Ouest (USA, OTAN). Doctrine Truman 1947, Plan Marshall.</li><li>Crises : blocus de Berlin 1948, Corée 1950-1953, mur de Berlin 1961, Cuba 1962.</li><li>Détente (années 1960-70) puis tensions des années 1980.</li><li>Fin : Gorbatchev, perestroïka et glasnost, chute du mur le 9 novembre 1989, disparition de l’URSS en 1991.</li></ul>`],
["Décolonisation et Tiers-Monde",`<ul><li>Facteurs : effets de la 2ᵈᵉ Guerre mondiale, rôle de l’ONU, anticolonialisme des deux Grands, nationalismes.</li><li><b>Bandung 1955</b> : Asie et Afrique condamnent le colonialisme.</li><li><b>Belgrade 1961</b> : naissance du mouvement des non-alignés.</li></ul>`],
["Afrique contemporaine et Sénégal",`<ul><li>Sénégal : loi-cadre Defferre 1956, référendum 1958, Fédération du Mali 1959, éclatement le 20 août 1960, indépendance proclamée.</li><li>Crise de décembre 1962 : Senghor contre Mamadou Dia, régime présidentiel.</li><li>OUA créée à Addis-Abeba en 1963, remplacée par l’Union africaine en 2002 ; NEPAD en 2001.</li></ul>`],
["Mondialisation et pôles",`<ul><li>Acteurs : firmes transnationales, OMC, FMI, Banque mondiale, ONG.</li><li>Flux : marchandises, capitaux, informations, migrations.</li><li>Pôles : États-Unis (hyperpuissance, soft power), Union européenne (1ʳᵉ puissance commerciale), Chine (« atelier du monde »).</li></ul>`],
["Géographie du Sénégal",`<ul><li>Population très jeune et concentrée sur le littoral : région de Dakar sur une toute petite part du territoire.</li><li>Primaire : arachide, horticulture, riz, pêche, élevage. Secondaire : phosphates, or, hydrocarbures (Sangomar, GTA). Tertiaire dominant.</li><li>Référentiel : Plan Sénégal Émergent. Intégration : UEMOA (monnaie, union douanière) et CEDEAO (libre circulation).</li></ul>`]],
fr:[
["La Négritude",`<ul><li>Contexte : Paris, années 1930, revues <i>Légitime Défense</i> (1932) et <i>L’Étudiant noir</i> (1935).</li><li><b>Césaire</b> : invente le mot dans <i>Cahier d’un retour au pays natal</i> ; négritude de combat. <b>Senghor</b> : négritude culturelle, « rendez-vous du donner et du recevoir ». <b>Damas</b> : <i>Pigments</i>, révolte contre l’assimilation.</li><li>Thèmes : réhabilitation de l’homme noir, refus de l’assimilation, retour aux sources.</li><li>Critiques : Soyinka (la tigritude), Adotevi.</li></ul>`],
["Romans africains engagés",`<ul><li><b>Mariama Bâ</b>, <i>Une si longue lettre</i> : roman épistolaire, Ramatoulaye à Aïssatou ; polygamie, condition féminine, éducation.</li><li><b>Cheikh Hamidou Kane</b>, <i>L’Aventure ambiguë</i> : Samba Diallo entre école coranique et école occidentale.</li><li><b>Sembène Ousmane</b>, <i>Les Bouts de bois de Dieu</i> : grève des cheminots du Dakar-Niger 1947-48, solidarité et rôle des femmes.</li></ul>`],
["Méthodologies",`<ul><li><b>Commentaire composé</b> : 2 ou 3 axes, jamais de paraphrase. Formule : procédé + citation + effet.</li><li><b>Dissertation littéraire</b> : problématique, plan dialectique, exemples précis d’œuvres lues.</li><li><b>Résumé et discussion</b> : réduire au quart (ou selon consigne), garder l’ordre logique, puis donner son avis argumenté.</li></ul>`]],

philo:[
["1. Qu’est-ce que la philosophie ?",`<p>Du grec <i>philein</i> (aimer) et <i>sophia</i> (sagesse) : la philosophie est la recherche permanente de la vérité, non la possession d’un savoir. Elle naît en Grèce (VIIᵉ-VIᵉ s. av. J.-C.) avec le passage du <b>mythos</b> (récit imaginaire) au <b>logos</b> (discours rationnel et critique).</p><h4>Philosophie et autres discours</h4><ul><li><b>Religion</b> : repose sur la foi, le dogme, la révélation. La philosophie repose sur le doute, le libre examen, la démonstration.</li><li><b>Science</b> : étudie un objet précis par l’expérience. La philosophie réfléchit sur la totalité de l’existence et sur les fondements de la science.</li><li><b>Mythe</b> : demande l’adhésion. La philosophie exige une justification.</li></ul><p>Jaspers : « Les questions en philosophie sont plus essentielles que les réponses. »</p><h4>La question de la philosophie africaine</h4><ul><li><b>Ethnophilosophie</b> (Tempels, <i>La Philosophie bantoue</i> ; Kagame) : dégager une sagesse collective à partir des mythes, proverbes et traditions.</li><li><b>Critique</b> : Hountondji parle d’« ethnologie à prétention philosophique » : la philosophie est écrite, critique, individuelle. Towa invite l’Afrique à s’approprier la science et la raison modernes.</li><li><b>Diagne, Wiredu</b> : repenser la tradition par la traduction et la décolonisation des concepts.</li></ul>`],
["2. La conscience",`<p>La conscience est la capacité de se saisir soi-même et le monde. On distingue la <b>conscience spontanée</b> (perception, sentiment d’exister), la <b>conscience réfléchie</b> (retour sur soi) et la <b>conscience morale</b> (jugement du bien et du mal).</p><h4>Les grands auteurs</h4><ul><li><b>Descartes</b> : par le doute méthodique, une seule certitude résiste : « Je pense, donc je suis » (cogito). La conscience est le fondement de toute vérité.</li><li><b>Husserl</b> : « Toute conscience est conscience de quelque chose » (intentionnalité) : la conscience est tournée vers le monde.</li><li><b>Sartre</b> : la conscience est néant d’être, pure liberté, toujours projet.</li></ul><h4>Limites</h4><p>Freud montre que le moi n’est « pas maître dans sa propre maison » : la conscience ne s’identifie pas à tout le psychisme.</p><div class="tip">Piège : confondre conscience (savoir qu’on vit) et connaissance de soi (travail, jamais achevé).</div>`],
["3. L’inconscient",`<p>L’inconscient désigne ce qui est psychique mais échappe à la conscience claire. Pour Freud, il est constitué de désirs et de souvenirs <b>refoulés</b> (surtout d’origine sexuelle et infantile).</p><h4>L’appareil psychique (Freud)</h4><ul><li><b>Le ça</b> : pulsions, principe de plaisir.</li><li><b>Le surmoi</b> : interdits et normes intériorisés (éducation, société).</li><li><b>Le moi</b> : médiateur sous pression du ça, du surmoi et de la réalité.</li></ul><h4>Les manifestations</h4><ul><li><b>Le rêve</b> : accomplissement déguisé d’un désir refoulé (<i>L’Interprétation des rêves</i>).</li><li><b>Lapsus, actes manqués, symptômes névrotiques</b>.</li></ul><h4>Discussion</h4><ul><li><b>Sartre</b> : l’inconscient est un alibi, il parle de « mauvaise foi ».</li><li><b>Popper</b> : la théorie freudienne est difficilement réfutable.</li><li>Portée : l’homme n’est pas entièrement transparent à lui-même ; la liberté devient un travail (la cure analytique).</li></ul>`],
["4. Autrui",`<p>Autrui est l’autre moi, un sujet comme moi mais qui n’est pas moi. Il pose deux problèmes : comment le connaître ? Quel rapport avoir avec lui ?</p><ul><li><b>Sartre</b> : le regard d’autrui me transforme en objet et provoque la honte (« l’enfer, c’est les autres »). Pourtant, autrui est indispensable pour me connaître.</li><li><b>Hegel</b> : la conscience de soi n’existe que reconnue par une autre ; dialectique du maître et de l’esclave (lutte pour la reconnaissance).</li><li><b>Lévinas</b> : le visage d’autrui m’appelle à la responsabilité.</li><li><b>Empathie, amitié, amour</b> : voies d’une rencontre non violente.</li><li><b>Diagne</b> : penser l’universel par le dialogue et la traduction entre cultures, sans effacer les différences.</li></ul><div class="tip">Exemple africain à citer : la notion de solidarité communautaire (l’individu existe par et avec les autres).</div>`],
["5. Langage, art et religion",`<h4>Le langage</h4><p>Système de signes qui permet de communiquer et de penser. Aristote : l’homme est un animal doué de <i>logos</i>. Le langage est à la fois outil de pensée, moyen de domination (propagande) et lien social.</p><h4>L’art</h4><ul><li><b>Kant</b> : est beau ce qui plaît universellement sans concept.</li><li><b>Hegel</b> : l’art est la manifestation sensible de l’Idée.</li><li><b>Nietzsche</b> : « L’art nous est donné pour ne pas mourir de la vérité. »</li><li><b>Afrique</b> : l’art traditionnel (masque, chant, danse) a une fonction sacrée, sociale et communautaire.</li></ul><h4>La religion</h4><ul><li><b>Marx</b> : « l’opium du peuple » (elle console de la misère sociale).</li><li><b>Freud</b> : une illusion née du besoin de protection.</li><li><b>Kant</b> : limiter le savoir pour faire place à la foi.</li><li>Foi et raison : la religion apporte un sens, mais elle peut mener au fanatisme si elle refuse l’esprit critique.</li></ul>`],
["6. L’État et le pouvoir",`<p>L’État est l’organisation politique et juridique d’une société sur un territoire. Weber : il détient le monopole de la violence légitime.</p><h4>Les théories du contrat social</h4><ul><li><b>Hobbes</b> (<i>Léviathan</i>) : l’état de nature est une guerre de tous contre tous (« l’homme est un loup pour l’homme »). Pour échapper à la mort violente, on cède ses droits à un souverain absolu.</li><li><b>Locke</b> : l’État protège les droits naturels (vie, liberté, propriété) ; il est limité par le consentement.</li><li><b>Rousseau</b> (<i>Du contrat social</i>) : l’homme naît libre ; le contrat crée une association où l’on obéit à la volonté générale, donc à soi-même.</li></ul><h4>Autres positions</h4><ul><li><b>Montesquieu</b> : séparer les pouvoirs législatif, exécutif, judiciaire pour éviter l’abus.</li><li><b>Marx</b> : l’État est l’instrument de la classe dominante.</li><li><b>Anarchistes</b> (Proudhon, Bakounine) : l’État opprime et doit disparaître.</li><li><b>Spinoza</b> : la fin de l’État est la liberté.</li></ul><div class="tip">Plan type : l’État est-il un danger pour la liberté ? 1) il l’opprime (totalitarisme, anarchisme), 2) il la garantit (droit, séparation des pouvoirs), 3) la vigilance des citoyens.</div>`],
["7. Droit, justice et violence",`<ul><li><b>Droit naturel</b> : droits inaliénables liés à la nature humaine (vie, liberté). <b>Droit positif</b> : lois écrites d’un pays, à un moment donné. Une loi légale peut être injuste : d’où la désobéissance civile (Thoreau, Gandhi).</li><li><b>Justice</b> : Aristote distingue la justice <i>commutative</i> (égalité stricte dans les échanges) et <i>distributive</i> (proportionnelle au mérite ou aux besoins). Elle vise à rendre à chacun son dû.</li><li><b>Violence</b> : usage abusif de la force. Freud la lie aux pulsions agressives ; Marx aux inégalités sociales et à l’exploitation ; Rousseau à la société.</li><li><b>Le droit contre la violence</b> : le droit remplace la force par la règle, mais il s’appuie lui-même sur une contrainte légitime. Rousseau : la force ne fait pas le droit.</li></ul>`],
["8. Vérité et connaissance",`<ul><li><b>Platon</b> : dans le mythe de la caverne, les prisonniers prennent les ombres pour la réalité ; la philosophie est un chemin vers la lumière du vrai.</li><li><b>Critères du vrai</b> : l’évidence (Descartes), la cohérence logique, l’accord avec la réalité (correspondance), la vérification par l’expérience.</li><li><b>Spinoza</b> : « La vérité est norme d’elle-même et du faux. »</li><li><b>Nietzsche</b> : critique de la vérité absolue ; il parle de perspectives.</li><li><b>Doute et certitude</b> : le doute méthodique cartésien est un outil de recherche, non un scepticisme paresseux.</li></ul>`],
["9. La science et la méthode",`<h4>Épistémologie</h4><p>Étude critique des principes, méthodes et résultats des sciences.</p><ul><li><b>Claude Bernard</b> (<i>Introduction à l’étude de la médecine expérimentale</i>) : démarche OHERIC : Observation, Hypothèse, Expérience, Résultat, Interprétation, Conclusion (loi).</li><li><b>Bachelard</b> : la science s’oppose à l’opinion ; elle progresse par rectification d’erreurs et rupture avec les obstacles épistémologiques.</li><li><b>Popper</b> : une théorie est scientifique si elle est falsifiable (réfutable). Exemple de pseudo-science : l’astrologie.</li><li><b>Kuhn</b> : l’histoire des sciences procède par révolutions et changements de paradigmes.</li></ul><h4>Limites</h4><p>« Science sans conscience n’est que ruine de l’âme » (Rabelais) : la technique pose des questions éthiques (bioéthique, armes, environnement).</p>`],
["10. La liberté",`<ul><li><b>Sens commun</b> : faire ce qu’on veut. <b>Philosophie</b> : choisir en connaissance de cause, sans contrainte.</li><li><b>Spinoza</b> : les hommes se croient libres parce qu’ils ignorent les causes qui les déterminent.</li><li><b>Sartre</b> : « l’existence précède l’essence » ; l’homme n’est rien d’autre que ce qu’il se fait ; il est « condamné à être libre ».</li><li><b>Kant</b> : la liberté est autonomie : obéir à la loi que la raison se donne.</li><li><b>Rousseau, Montesquieu</b> : l’obéissance à la loi qu’on s’est prescrite est liberté ; la liberté est le droit de faire ce que les lois permettent.</li><li><b>Déterminismes</b> : biologique, social (Marx), psychique (Freud). Question : liberté réelle ou illusion ?</li></ul>`],
["11. Devoir et bonheur",`<h4>Le devoir</h4><p><b>Kant</b> : un acte est moral s’il est fait par devoir, non par intérêt. Impératif catégorique : « Agis de telle sorte que la maxime de ton action puisse devenir une loi universelle. »</p><h4>Le bonheur</h4><ul><li><b>Aristote</b> : vie conforme à la vertu (eudémonia).</li><li><b>Épicure</b> : plaisirs naturels et nécessaires, absence de trouble.</li><li><b>Stoïciens</b> : accepter ce qui ne dépend pas de nous.</li><li><b>Mill</b> (utilitarisme) : le plus grand bonheur du plus grand nombre.</li></ul><p>Tension : le bonheur et le devoir s’accordent-ils ? Kant : le devoir rend digne d’être heureux.</p>`],
["12. La mort et le temps",`<ul><li><b>Épicure</b> : « La mort n’est rien pour nous », car tant que nous sommes, elle n’est pas.</li><li><b>Heidegger</b> : l’homme est un « être-pour-la-mort » ; la finitude donne son sens à l’existence.</li><li><b>Saint Augustin</b> (<i>Confessions</i>) : le temps est mesuré par l’âme (présent du passé, du présent, de l’avenir).</li><li><b>Bergson</b> : la durée vécue, qualitative, s’oppose au temps des horloges.</li><li><b>Pensée africaine</b> : les ancêtres restent présents dans la communauté (Mbiti : les notions de <i>sasa</i> et <i>zamani</i>).</li></ul>`],
["13. Méthode de la dissertation",`<h4>Au brouillon (30 min)</h4><ul><li>Analyser les <b>termes</b> du sujet, repérer le paradoxe, formuler la problématique.</li><li>Faire un plan en 3 parties avec auteurs et exemples.</li></ul><h4>Rédaction</h4><ul><li><b>Introduction</b> : amorce, sujet, problématique, annonce du plan.</li><li><b>Thèse</b> : défendre la position du sujet. <b>Antithèse</b> : objections et théories contraires. <b>Synthèse</b> : dépassement, jamais une simple conciliation molle.</li><li>Chaque paragraphe : idée, explication, auteur ou citation, exemple, transition.</li><li><b>Conclusion</b> : bilan, réponse nette, ouverture.</li></ul><div class="tip">Erreurs fréquentes : réciter le cours hors sujet, empiler des citations sans les expliquer, ne pas répondre à la question posée.</div>`],
["14. Méthode du commentaire de texte",`<ul><li><b>Lecture</b> : repérer le thème (de quoi parle le texte), la thèse (ce que l’auteur affirme), les mots-clés.</li><li><b>Introduction</b> : présentation du texte et de l’auteur, thème, thèse, problème, plan.</li><li><b>Développement</b> : suivre la structure logique du texte (étapes). Expliquer chaque idée avec vos mots, la reformuler, citer brièvement.</li><li><b>Discussion</b> : intérêt et limites de la thèse, autres positions.</li><li><b>Conclusion</b> : bilan et portée du texte.</li></ul>`]
],

["Guerre froide (1) : origines et blocs",`<p>La Guerre froide (1947-1991) est un affrontement idéologique, politique, économique et militaire entre les États-Unis et l’URSS, sans combat direct entre les deux.</p><h4>Origines (1945-1947)</h4><ul><li>Conférences de Yalta (février 1945) et Potsdam (été 1945) : désaccords sur l’Europe de l’Est et l’Allemagne.</li><li>Churchill à Fulton (1946) : « rideau de fer ».</li><li><b>Doctrine Truman</b> (mars 1947) : endiguement du communisme. <b>Plan Marshall</b> (juin 1947) : aide économique à l’Europe occidentale.</li><li><b>Doctrine Jdanov</b> (1947) : le monde divisé en deux camps ; Kominform.</li></ul><h4>Les blocs</h4><ul><li><b>Ouest</b> : capitalisme, démocratie libérale, OTAN (1949).</li><li><b>Est</b> : communisme, parti unique, CAEM (1949), Pacte de Varsovie (1955).</li><li>Allemagne divisée en 1949 : RFA et RDA.</li></ul>`],
["Guerre froide (2) : crises, détente, fin",`<h4>Crises</h4><ul><li>Blocus de Berlin (1948-49), pont aérien occidental.</li><li>Guerre de Corée (1950-53), de l’Indochine au Vietnam.</li><li>Hongrie et Suez (1956), mur de Berlin (1961), crise des missiles de Cuba (octobre 1962).</li></ul><h4>Détente (années 1960-70)</h4><ul><li>« Téléphone rouge » (1963), accords SALT (1972), conférence d’Helsinki (1975).</li></ul><h4>Nouvelles tensions</h4><ul><li>Invasion soviétique de l’Afghanistan (1979), « guerre des étoiles » de Reagan (IDS, 1983).</li></ul><h4>Fin</h4><ul><li>Gorbatchev (1985) : perestroïka (reconstruction) et glasnost (transparence).</li><li>Chute du mur de Berlin (9 novembre 1989), réunification allemande (3 octobre 1990), disparition de l’URSS (décembre 1991).</li></ul>`],
["Décolonisation et Tiers-Monde",`<h4>Causes</h4><ul><li>Affaiblissement des métropoles après 1945, nouveaux idéaux (Charte de l’ONU, droit des peuples), pressions américaine et soviétique, nationalismes et élites formées en Occident.</li></ul><h4>Étapes</h4><ul><li>Asie : Inde et Pakistan (1947), Indonésie, Indochine (Diên Biên Phu, 1954).</li><li>Afrique : Ghana de Nkrumah (1957), Guinée (1958), « année de l’Afrique » 1960 (17 indépendances), Algérie (1954-62, guerre).</li><li>Deux voies : négociation (Afrique britannique, Afrique noire française) ou guerre (Indochine, Algérie).</li></ul><h4>Affirmation du Tiers-Monde</h4><ul><li><b>Bandung (1955)</b> : Nehru, Nasser, Soekarno ; condamnation du colonialisme.</li><li><b>Belgrade (1961)</b> : mouvement des non-alignés (Tito, Nasser, Nehru).</li><li>Défis : sous-développement, dette, néocolonialisme ; revendication d’un nouvel ordre économique mondial (années 1970).</li></ul>`],
["L’Afrique contemporaine",`<h4>Défis politiques</h4><ul><li>États jeunes aux frontières héritées de la colonisation, partis uniques et coups d’État dès les années 1960.</li><li>Conflits : guerre du Biafra, génocide rwandais (1994), conflits de la RDC, terrorisme au Sahel.</li><li>Années 1990 : démocratisation (conférences nationales, pluralisme), puis alternances.</li></ul><h4>Intégration africaine</h4><ul><li><b>OUA</b> (1963, Addis-Abeba) : unité africaine, intangibilité des frontières, soutien aux mouvements de libération.</li><li><b>Union africaine</b> (2002, Durban) : plus d’intégration, droit d’intervention en cas de crimes graves ; <b>NEPAD</b> (2001) : programme de développement.</li></ul>`],
["Le Sénégal vers l’indépendance",`<ul><li><b>1946-1956</b> : vie politique avec Lamine Guèye puis Senghor (Bloc démocratique sénégalais).</li><li><b>1956</b> : loi-cadre Defferre, autonomie interne. <b>1958</b> : le Sénégal vote « oui » au référendum gaulliste et entre dans la Communauté.</li><li><b>1959</b> : Fédération du Mali (Sénégal, Soudan français) ; indépendance de la Fédération en juin 1960.</li><li><b>20 août 1960</b> : rupture entre Senghor et Modibo Keïta ; le Sénégal proclame son indépendance. Fête nationale le 4 avril (date liée aux accords de transfert de compétences).</li></ul><h4>Crise de décembre 1962</h4><p>Conflit entre Senghor (président de la République) et Mamadou Dia (président du Conseil). Dia est arrêté ; le régime devient présidentiel (1963).</p>`],
["Mondialisation et pôles de puissance",`<ul><li><b>Définition</b> : intensification des échanges de biens, capitaux, informations, personnes.</li><li><b>Facteurs</b> : transports (conteneur), Internet, libéralisation du commerce (OMC).</li><li><b>Acteurs</b> : FTN, États, organisations (OMC, FMI, Banque mondiale), ONG.</li><li><b>Inégalités</b> : la Triade (USA, Europe, Japon) domine ; les pays émergents montent (Chine, Inde, Brésil) ; l’Afrique reste marginalisée.</li><li><b>Pôles</b> : États-Unis (puissance économique, militaire, culturelle), Union européenne (1ʳᵉ puissance commerciale, intégration inachevée), Chine (atelier du monde, 2ᵉ économie).</li></ul>`],
["Géographie du Sénégal",`<ul><li><b>Milieu</b> : relief plat, climat tropical sec (saison des pluies courte), fleuves Sénégal, Gambie, Casamance ; zone des Niayes.</li><li><b>Population</b> : environ 18 millions d’habitants, très jeune, concentrée à l’ouest (région de Dakar), urbanisation rapide.</li><li><b>Économie</b> : primaire (arachide, riz, horticulture, pêche menacée par la surpêche), secondaire (phosphates, or, pétrole et gaz offshore, agroalimentaire), tertiaire dominant (commerce, services, télécoms, tourisme).</li><li><b>Politiques</b> : Plan Sénégal Émergent ; enjeux : emploi des jeunes, énergie, infrastructures.</li><li><b>Intégration</b> : UEMOA (1994, union douanière et monétaire, franc CFA), CEDEAO (1975). Vérifiez l’actualité : plusieurs États (Mali, Burkina, Niger) ont annoncé leur retrait de la CEDEAO.</li></ul>`]
],

["La Négritude",`<p>Mouvement littéraire et idéologique né à Paris dans les années 1930 : des étudiants noirs (Césaire, Senghor, Damas) revendiquent leur identité face au racisme et à l’assimilation. Revues : <i>Légitime Défense</i> (1932), <i>L’Étudiant noir</i> (1935).</p><h4>Les trois pères</h4><ul><li><b>Césaire</b> : <i>Cahier d’un retour au pays natal</i> (1939) ; négritude de combat, <i>Discours sur le colonialisme</i> (1950).</li><li><b>Senghor</b> : <i>Chants d’ombre</i>, <i>Hosties noires</i>, <i>Éthiopiques</i> ; négritude culturelle, « ensemble des valeurs du monde noir », métissage et « rendez-vous du donner et du recevoir ».</li><li><b>Damas</b> : <i>Pigments</i> (1937) ; révolte contre l’assimilation, langage direct et rythmé.</li></ul><h4>Thèmes</h4><p>Réhabilitation de l’homme noir, retour aux sources africaines, refus de l’assimilation, dénonciation du colonialisme, célébration de la femme noire et de la nature.</p><h4>Critiques</h4><p>Soyinka : « Le tigre ne proclame pas sa tigritude, il saute sur sa proie. » Adotevi : la négritude masque les problèmes socio-économiques.</p>`],

philo1:`<p>Le mot vient du latin <i>conscientia</i> : « savoir avec ». Être conscient, c’est savoir qu’on sait, c’est se rapporter à soi-même en même temps qu’au monde. Dans ce chapitre, on étudie ce que la conscience nous donne, ce qu’elle ne nous donne pas, et ce qu’elle nous demande moralement.</p>
<h4>1. Les trois sens du mot</h4><ul><li><b>Conscience spontanée (psychologique)</b> : je perçois, je sens, je sais que j’existe. Elle est présente dès l’éveil.</li><li><b>Conscience réfléchie</b> : je reviens sur mes pensées pour les examiner (introspection).</li><li><b>Conscience morale</b> : je juge mes actes et ceux des autres comme bons ou mauvais. Elle donne le remords ou la satisfaction.</li></ul>
<h4>2. La conscience comme fondement de la certitude</h4><p><b>Descartes</b> (<i>Méditations métaphysiques</i>) cherche une vérité indubitable. Il doute de tout : des sens (ils trompent), des rêves (on confond veille et rêve), des mathématiques (un malin génie pourrait nous tromper). Mais pour douter, il faut penser ; pour penser, il faut exister. D’où le <b>cogito</b> : « Je pense, donc je suis ». La conscience est donc première : tout le reste dépend d’elle.</p><ul><li><b>Locke</b> : l’identité personnelle repose sur la conscience et la mémoire continues.</li><li><b>Kant</b> : le « je pense » doit pouvoir accompagner toutes mes représentations ; il assure l’unité de l’expérience.</li><li><b>Husserl</b> : la conscience est toujours <i>conscience de quelque chose</i> (intentionnalité) ; elle n’est pas un contenant fermé mais une ouverture au monde.</li></ul>
<h4>3. Les limites de la conscience</h4><ul><li><b>Freud</b> : une grande partie de notre vie psychique est inconsciente (désirs refoulés). Le moi n’est « pas maître dans sa propre maison ». Rêves, lapsus et symptômes le prouvent.</li><li><b>Marx</b> : « Ce n’est pas la conscience des hommes qui détermine leur être, c’est inversement leur être social qui détermine leur conscience. » Nos idées dépendent de notre classe et de notre époque (idéologie).</li><li><b>Nietzsche</b> : la conscience est une surface, un instrument de communication, non le centre de l’être.</li><li><b>Spinoza</b> : nous avons conscience de nos désirs mais ignorons leurs causes, d’où l’illusion de liberté.</li></ul>
<h4>4. La conscience morale</h4><ul><li><b>Rousseau</b> : la conscience est un « instinct divin », une voix intérieure qui distingue le bien et le mal avant tout raisonnement.</li><li><b>Kant</b> : la conscience morale est la raison pratique qui juge selon le devoir.</li><li><b>Freud</b> : la conscience morale vient du surmoi, produit de l’éducation et de la société.</li><li>Question : la morale est-elle innée ou apprise ? Les deux thèses doivent être discutées.</li></ul>
<h4>5. Conscience et liberté</h4><p><b>Sartre</b> : la conscience est néant d’être : elle n’est pas une chose figée, elle est capacité de se projeter, de dire non, de choisir. Fuir sa liberté, c’est la « mauvaise foi » (jouer un rôle, s’excuser par des déterminismes).</p>
<div class="tip"><b>Sujets types</b> : La conscience fait-elle l’homme ? Peut-on se connaître soi-même ? Suis-je ce que j’ai conscience d’être ? La conscience est-elle source de liberté ?</div>
<h4>Plan modèle : « Suis-je ce que j’ai conscience d’être ? »</h4><ul><li><b>I.</b> Oui : par la conscience, je me saisis comme sujet (Descartes, Locke).</li><li><b>II.</b> Non : l’inconscient, la société et l’histoire me déterminent (Freud, Marx, Nietzsche).</li><li><b>III.</b> Dépassement : je ne suis pas donné, je me construis par la réflexion et le choix (Sartre). La conscience est un travail jamais achevé.</li></ul>
<h4>À retenir</h4><ul><li>La conscience est le point de départ de la connaissance, mais pas la totalité du psychisme.</li><li>Auteurs à maîtriser : Descartes, Husserl, Freud, Marx, Sartre, Rousseau, Kant.</li><li>Évitez la dissertation « cours récité » : répondez toujours à la question posée.</li></ul>`,
philo5:`<p>L’État est l’organisation politique, juridique et administrative d’une société sur un territoire donné, dotée d’un pouvoir souverain. Il faut le distinguer de la <b>nation</b> (communauté historique et culturelle), du <b>gouvernement</b> (ceux qui exercent le pouvoir) et de la <b>société civile</b> (citoyens, associations, médias). <b>Max Weber</b> : l’État détient le monopole de la violence physique légitime.</p>
<h4>1. Pourquoi un État ? L’origine</h4><ul><li><b>Aristote</b> : l’homme est un animal politique ; la cité est naturelle et permet la vie bonne.</li><li><b>Théories du contrat social</b> : l’État résulte d’un accord entre individus. L’état de nature est une hypothèse de raisonnement, pas un fait historique.</li><li><b>Hobbes</b> (<i>Léviathan</i>, 1651) : à l’état de nature règne la guerre de tous contre tous, la vie est « solitaire, pauvre, méchante, brutale et courte ». Par peur de la mort violente, on remet tous ses droits à un souverain absolu qui assure la paix.</li><li><b>Locke</b> : l’état de nature est régi par la loi naturelle, mais sans juge impartial. L’État protège la vie, la liberté, la propriété ; si le pouvoir devient tyrannique, le peuple peut résister.</li><li><b>Rousseau</b> (<i>Du contrat social</i>, 1762) : « L’homme est né libre, et partout il est dans les fers. » Le contrat vise une association où chacun s’unit à tous et n’obéit pourtant qu’à lui-même, à travers la <b>volonté générale</b>. La souveraineté appartient au peuple.</li></ul>
<h4>2. Les formes de gouvernement</h4><ul><li><b>Monarchie, aristocratie, démocratie</b> (Aristote, Montesquieu) et leurs dérives : tyrannie, oligarchie, démagogie.</li><li><b>Démocratie</b> : pouvoir du peuple, élections, pluralisme, droits de l’homme.</li><li><b>Totalitarisme</b> (Hannah Arendt, <i>Les Origines du totalitarisme</i>) : un parti, une idéologie, une terreur qui absorbe la société civile.</li><li><b>Montesquieu</b> (<i>De l’esprit des lois</i>) : « Pour qu’on ne puisse abuser du pouvoir, il faut que le pouvoir arrête le pouvoir » : séparation des pouvoirs législatif, exécutif, judiciaire.</li></ul>
<h4>3. Les fonctions de l’État</h4><ul><li>Sécurité intérieure et extérieure.</li><li>Justice et respect du droit.</li><li>Garantie des libertés et de l’égalité des droits.</li><li>Service public : éducation, santé, infrastructures, redistribution.</li><li><b>Spinoza</b> : « La fin de l’État est la liberté. »</li></ul>
<h4>4. Critiques de l’État</h4><ul><li><b>Marx</b> : l’État est l’instrument de domination de la classe dominante ; il disparaîtra dans une société sans classes.</li><li><b>Anarchistes</b> (Proudhon, Bakounine) : toute autorité étatique est oppressive.</li><li><b>Nietzsche</b> : « L’État est le plus froid des monstres froids. »</li></ul>
<h4>5. Obéir ou résister ?</h4><ul><li><b>Alain</b> : le citoyen obéit mais résiste, il contrôle les pouvoirs.</li><li><b>Désobéissance civile</b> (Thoreau, Gandhi, Martin Luther King) : refus public, non violent, d’une loi jugée injuste.</li><li>Distinction : droit positif (la loi) et droit naturel (la justice).</li></ul>
<h4>6. Exemples africains et sénégalais</h4><ul><li>États-nations hérités de la colonisation : frontières arbitraires, défis d’intégration nationale.</li><li>Sénégal : crise de décembre 1962 entre Senghor et Dia, passage au régime présidentiel ; alternances démocratiques depuis 2000.</li></ul>
<div class="tip"><b>Sujets types</b> : L’État est-il l’ennemi de la liberté ? Peut-on se passer de l’État ? Doit-on toujours obéir à l’État ? Le pouvoir politique repose-t-il sur la force ?</div>
<h4>Plan modèle : « L’État est-il l’ennemi de la liberté ? »</h4><ul><li><b>I.</b> Oui : il contraint, surveille, peut opprimer (Marx, anarchistes, totalitarisme).</li><li><b>II.</b> Non : sans État, pas de sécurité ni de droit (Hobbes, Locke, Rousseau, Spinoza).</li><li><b>III.</b> Dépassement : l’État de droit et la séparation des pouvoirs (Montesquieu), plus la vigilance des citoyens, concilient autorité et liberté.</li></ul>`

DEEP.philo0=`<p>La philosophie n’est pas un savoir qu’on récite : c’est une manière de penser. Ce chapitre répond à trois questions : d’où vient-elle, en quoi diffère-t-elle des autres discours, et à quoi sert-elle ?</p>
<h4>1. Le mot et son sens</h4><p>Du grec <i>philein</i> (aimer) et <i>sophia</i> (sagesse, savoir) : la philosophie est l’amour de la sagesse. La tradition attribue le mot à Pythagore, qui refusait de se dire « sage » et préférait « ami de la sagesse ». Le philosophe ne possède pas la vérité, il la cherche. Jaspers : les questions sont plus essentielles que les réponses.</p>
<h4>2. Les origines</h4><ul><li><b>La naissance grecque</b> (VIIᵉ-VIᵉ s. av. J.-C.) : à Milet, Thalès et ses successeurs expliquent la nature par des causes naturelles et non plus par des dieux. Puis Socrate, Platon et Aristote fondent la discussion rationnelle.</li><li><b>Conditions favorables</b> : la cité et le débat public, l’écriture, le commerce et les contacts entre peuples, le loisir (<i>schôlè</i>) qui permet de penser.</li><li><b>Du mythos au logos</b> : le mythe raconte une histoire sacrée qu’on croit ; le logos donne des raisons qu’on peut discuter. Attention : le passage n’est pas brutal, le mythe contient lui aussi une pensée (Platon utilise des mythes).</li><li><b>L’étonnement</b> : Platon et Aristote placent le point de départ de la philosophie dans l’étonnement (<i>thaumazein</i>) devant le monde.</li><li><b>Un débat sur les sources</b> : Cheikh Anta Diop soutient que les savoirs grecs doivent beaucoup à l’Égypte ancienne, donc à l’Afrique. L’idée est discutée, mais elle rappelle que la pensée ne naît pas dans un seul endroit.</li></ul>
<h4>3. Ce qui fait la spécificité de la philosophie</h4><ul><li><b>Face au mythe</b> : elle exige des preuves et une justification.</li><li><b>Face à la religion</b> : elle ne s’appuie pas sur la révélation ni le dogme, mais sur le libre examen. Elle peut toutefois réfléchir à la religion.</li><li><b>Face à la science</b> : la science étudie un domaine précis avec des expériences ; la philosophie pose des questions générales (Qu’est-ce que la vérité ? la liberté ?) et réfléchit sur la science elle-même.</li><li><b>Face à l’opinion</b> : elle remet en cause les évidences et les préjugés.</li><li><b>Caractères</b> : esprit critique, question radicale (remonter aux fondements), exigence logique, volonté d’universalité, réflexion sur soi.</li></ul>
<h4>4. À quoi sert-elle ?</h4><ul><li><b>Kant</b> : « Aie le courage de te servir de ton propre entendement » : penser par soi-même.</li><li><b>Épicure</b> : la philosophie soigne l’âme.</li><li><b>Marx</b> : les philosophes ont seulement interprété le monde, il s’agit de le transformer.</li><li>Utilité pratique : former le jugement, défendre la liberté de pensée, aider à choisir dans la vie et dans la cité.</li></ul>
<h4>5. La philosophie et la pensée africaine</h4><ul><li><b>Ethnophilosophie</b> (Tempels, Kagame) : une philosophie collective dans les proverbes, contes et traditions.</li><li><b>Hountondji</b> : critique, parle d’« ethnologie à prétention philosophique » ; la philosophie suppose une réflexion écrite, critique et personnelle.</li><li><b>Towa</b> : l’Afrique doit s’approprier la science et la raison modernes sans attachement aveugle au passé.</li><li><b>Oruka</b> : existence de « sages » africains capables de réflexion critique.</li><li><b>Diagne</b> : penser l’universel par la traduction et le dialogue des cultures.</li></ul>
<div class='tip'><b>Sujets types</b> : La philosophie est-elle utile ? Peut-on philosopher sans étudier les philosophes ? La philosophie est-elle une science ? Faut-il opposer la philosophie et la religion ? Existe-t-il une philosophie africaine ?</div>
<h4>Plan modèle : « La philosophie est-elle utile ? »</h4><ul><li><b>I.</b> Elle paraît inutile : elle ne produit ni objets ni résultats mesurables, elle débat sans fin (face à la science et à la technique).</li><li><b>II.</b> Mais elle est utile : elle forme le jugement critique, éclaire les choix moraux et politiques (Kant, Épicure, Socrate).</li><li><b>III.</b> Dépassement : son utilité est d’un autre ordre, elle rend libre ; elle est indispensable à la démocratie et à la science.</li></ul>
<h4>À retenir</h4><ul><li>Philosopher, c’est chercher, douter, argumenter.</li><li>Distinguez mythe, religion, science et philosophie par leur méthode.</li><li>Ne dites jamais que les Africains n’ont pas de pensée : discutez la question de la philosophie africaine avec des auteurs.</li></ul>`;
DEEP.philo2=`<p>Est inconscient ce qui agit en nous sans que nous en ayons conscience clairement. L’idée existe avant Freud (Leibniz parle de « petites perceptions », Schopenhauer d’une volonté aveugle), mais c’est Freud qui en fait une théorie générale du psychisme.</p>
<h4>1. La théorie de Freud</h4><ul><li><b>Première topique</b> : conscient (ce dont je me rends compte), préconscient (ce que je peux rappeler), inconscient (ce qui est refoulé et reste inaccessible).</li><li><b>Seconde topique</b> : le <b>ça</b> (pulsions, principe de plaisir), le <b>surmoi</b> (interdits intériorisés, venus de l’éducation) et le <b>moi</b> (médiateur entre les deux et la réalité).</li><li><b>Le refoulement</b> : un désir inacceptable est repoussé hors de la conscience, mais il continue d’agir. Freud insiste sur la sexualité infantile et le complexe d’Œdipe.</li><li><b>Les pulsions</b> : pulsions de vie (Éros) et pulsions de mort.</li></ul>
<h4>2. Comment l’inconscient se manifeste</h4><ul><li><b>Le rêve</b> : accomplissement déguisé d’un désir refoulé. Freud distingue le contenu manifeste (ce dont on se souvient) du contenu latent (le sens caché).</li><li><b>Le lapsus et l’acte manqué</b> : l’inconscient « trahit » ce que la conscience cache.</li><li><b>Le symptôme névrotique</b> : un conflit refoulé s’exprime sous une forme déguisée (angoisse, phénomènes physiques sans cause médicale).</li></ul>
<h4>3. La cure psychanalytique</h4><p>Par l’association libre (dire tout ce qui vient à l’esprit) et l’interprétation, le patient prend conscience de ce qui le gouvernait. Idée centrale : « Là où ça était, le moi doit advenir. » Freud dit aussi que le moi n’est « pas maître dans sa propre maison ».</p>
<h4>4. Les discussions</h4><ul><li><b>Sartre</b> : l’inconscient est un alibi ; la conscience est toujours conscience d’elle-même. Se mentir à soi-même, c’est la « mauvaise foi ».</li><li><b>Popper</b> : la théorie de Freud est difficilement réfutable, donc discutable comme science.</li><li><b>Jung</b> : propose un inconscient collectif (archétypes) ; <b>Lacan</b> : l’inconscient est structuré comme un langage.</li><li>Autres lectures : Marx (l’idéologie nous détermine à notre insu), Nietzsche (la conscience n’est qu’une surface).</li></ul>
<h4>5. Conséquences</h4><ul><li><b>Pour la liberté</b> : je suis moins libre que je ne le crois, mais je peux le devenir en comprenant mes motivations.</li><li><b>Pour la responsabilité</b> : l’inconscient n’excuse pas mes actes ; il invite à mieux me connaître.</li><li><b>Pour la connaissance de soi</b> : l’introspection ne suffit pas.</li></ul>
<div class='tip'><b>Sujets types</b> : L’inconscient est-il un obstacle à la liberté ? Peut-on se mentir à soi-même ? Sommes-nous responsables de ce que nous ignorons de nous-mêmes ? La conscience est-elle tout le psychisme ?</div>
<h4>Plan modèle : « Peut-on se mentir à soi-même ? »</h4><ul><li><b>I.</b> Oui : le refoulement et les rationalisations montrent qu’on cache certaines vérités à sa conscience (Freud).</li><li><b>II.</b> Non : mentir suppose de savoir la vérité ; une même conscience ne peut pas être trompeur et trompé (Sartre). Il parle de mauvaise foi.</li><li><b>III.</b> Dépassement : on se ment partiellement, par fuite de la liberté ; la lucidité est un effort permanent.</li></ul>
<h4>À retenir</h4><ul><li>Vocabulaire : refoulement, pulsion, ça, moi, surmoi, lapsus, contenu manifeste et latent.</li><li>Auteurs : Freud (théorie), Sartre (critique), Popper (réfutabilité).</li><li>Évitez de réduire Freud à « tout est sexuel ».</li></ul>`;
DEEP.philo3=`<p>Autrui est l’autre homme, un sujet comme moi mais qui n’est pas moi. Différent de « les autres » en général, il pose deux questions : comment puis-je savoir qu’il existe et qu’il pense ? Quels rapports puis-je ou dois-je avoir avec lui ?</p>
<h4>1. Comment connaître autrui ?</h4><ul><li><b>Descartes</b> : depuis ma fenêtre, je ne vois que des chapeaux et des manteaux qui pourraient cacher des automates. Je juge que ce sont des hommes par un acte de jugement, non par la vue.</li><li><b>Husserl</b> : je saisis autrui par analogie et empathie : son corps ressemble au mien, je lui attribue une conscience semblable.</li><li><b>Merleau-Ponty</b> : autrui est déjà présent dans la perception : je comprends sa colère ou sa joie directement dans ses gestes et son visage.</li></ul>
<h4>2. Autrui, source de conflit</h4><ul><li><b>Sartre</b> (<i>L’Être et le Néant</i>) : sous le regard d’autrui je deviens un objet, j’éprouve la honte. D’où « l’enfer, c’est les autres » (<i>Huis clos</i>). Pourtant, autrui m’est indispensable pour me connaître moi-même.</li><li><b>Hegel</b> : la conscience de soi cherche à être reconnue par une autre ; la lutte pour la reconnaissance mène à la relation maître-esclave. La vraie solution est la reconnaissance réciproque.</li><li><b>Hobbes</b> : la défiance entre les hommes explique la guerre de tous contre tous.</li></ul>
<h4>3. Autrui, source d’obligations et de rencontre</h4><ul><li><b>Kant</b> : traite l’humanité, en toi et en autrui, toujours comme une fin et jamais seulement comme un moyen.</li><li><b>Lévinas</b> : le visage d’autrui, fragile et nu, m’interdit de le tuer et m’appelle à la responsabilité.</li><li><b>Rousseau</b> : la pitié, répugnance à voir souffrir, est un sentiment naturel.</li><li><b>Aristote</b> : l’amitié véritable repose sur la vertu et rend la vie bonne.</li><li><b>Pensée africaine</b> : l’idée que « je suis parce que nous sommes » (Mbiti, ubuntu) fait de la communauté la condition de l’individu.</li></ul>
<h4>4. Autrui et la différence des cultures</h4><p><b>Lévi-Strauss</b> (<i>Race et histoire</i>) : l’ethnocentrisme est l’attitude qui rejette comme barbare ce qui n’appartient pas à sa culture. Le barbare, c’est d’abord celui qui croit à la barbarie. Il faut reconnaître l’égale dignité des cultures. <b>Diagne</b> : l’universel se construit par le dialogue et la traduction entre cultures, non par l’effacement des différences.</p>
<div class='tip'><b>Sujets types</b> : Autrui est-il un obstacle à ma liberté ? Puis-je me connaître sans autrui ? Peut-on vivre sans les autres ? Respecter autrui, est-ce le reconnaître comme semblable ou comme différent ?</div>
<h4>Plan modèle : « Autrui est-il un obstacle à ma liberté ? »</h4><ul><li><b>I.</b> Oui : son regard me fige, sa présence me limite, les conflits (Sartre, Hobbes).</li><li><b>II.</b> Non : sans autrui, pas de langage, ni de conscience de soi, ni de reconnaissance (Hegel, Aristote).</li><li><b>III.</b> Dépassement : la liberté de chacun se réalise dans la reconnaissance réciproque et le respect (Kant, Lévinas).</li></ul>
<h4>À retenir</h4><ul><li>Distinguez trois niveaux : connaître autrui, vivre avec autrui, devoir envers autrui.</li><li>Auteurs : Sartre (regard), Hegel (reconnaissance), Kant (fin en soi), Lévinas (visage), Lévi-Strauss (ethnocentrisme).</li></ul>`;

function keyTerms(html){const d=document.createElement('div');d.innerHTML=html;const t=[...new Set([...d.querySelectorAll('b')].map(b=>b.textContent.trim()).filter(t=>t.length>2&&t.length<40))];return {d,t}}
function autoExo(title,html){const t=keyTerms(html).t;const T=t.length?t:[title];
 return [T.slice(0,4).map(x=>['Explique « '+x+' » avec tes mots.','Auto-correction : retrouve « '+x+' » dans le cours et vérifie que ta réponse contient l’idée centrale, un auteur ou un exemple.']),
 [['Explique et illustre par un exemple : « '+title+' ».','Corrigé indicatif : définis les notions, présente les idées du cours dans l’ordre, ajoute un exemple précis, termine par un bilan en une phrase.']],
 [['Construis un plan détaillé en trois parties pour discuter : « '+title+' ».','Corrigé indicatif : I. thèse (arguments et auteurs du cours) ; II. objections et limites ; III. dépassement. Chaque partie : idée, auteur ou exemple, mini-conclusion.']],
 [['Rédige l’introduction complète (amorce, sujet, problématique, plan) et la première partie sur : « '+title+' ».','Grille : amorce sans banalité, sujet reformulé, vrai problème (paradoxe), plan annoncé ; première partie avec au moins deux auteurs ou exemples expliqués.']]]}
function explain(html){const {d,t}=keyTerms(html);const first=(d.querySelector('p')||d.querySelector('li')).textContent;const hs=[...d.querySelectorAll('h4')].map(h=>'<li>'+h.textContent+'</li>').join('');
 return `<h4>L’essentiel en quelques mots</h4><p>${first}</p>${hs?`<h4>Les grandes idées du chapitre</h4><ul>${hs}</ul>`:''}<h4>Mots et auteurs à connaître</h4><p>${t.slice(0,12).join(', ')}</p><div class='tip'>Astuce : masquez cette liste, expliquez chaque terme à voix haute, puis vérifiez dans le cours.</div>`}
function exoView(el,key,title,html){const lv=['Facile','Bac normal','Bac difficile','Expert'];const set=(EXO[key]||autoExo(title,html))[cLv];
 el.innerHTML=`<div class='flex gap-2 flex-wrap mb-2'>${lv.map((l,i)=>`<button class='chip ${i===cLv?'on':''}' data-lv='${i}'>${l}</button>`).join('')}</div>`+set.map((e,i)=>`<div class='card mb-2'><p class='font-semibold'>${i+1}. ${e[0]}</p><details><summary class='mut' style='cursor:pointer'>Voir le corrigé</summary><p>${e[1]}</p></details></div>`).join('')+(EXO[key]?'':`<p class='mut text-sm'>Exercices guidés générés à partir du chapitre : comparez avec le cours ou avec votre professeur.</p>`);
 el.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{cLv=+b.dataset.lv;exoView(el,key,title,html)})}
function devView(el,key,title){const crit=['Notions définies','Au moins trois idées développées','Auteurs ou exemples précis','Conclusion qui répond au sujet'];
 el.innerHTML=`<div class='card'><p class='font-semibold'>Devoir (1 h) : traitez le chapitre « ${title} » en réponse rédigée.</p><p class='mut text-sm'>Définissez les notions, développez trois idées avec auteurs ou exemples, concluez par une réponse nette. Ouvrez le cours seulement après avoir écrit.</p></div><textarea id='dv' class='w-full mt-2' rows='10' placeholder='Votre devoir…'></textarea><p class='mut text-sm' id='dw'></p><h4>Auto-évaluation</h4>${crit.map(t=>`<label class='block'><input type='checkbox' class='dc'> ${t}</label>`).join('')}<p class='font-semibold mt-1' id='dsc'></p>`;
 const ta=el.querySelector('#dv');ta.value=S.get('dv'+key,'');
 const up=()=>{const w=ta.value.trim().split(/\s+/).filter(Boolean).length;el.querySelector('#dw').textContent=w+' mots (enregistré sur cet appareil)';S.set('dv'+key,ta.value);const D=S.get('devs',{});D[key]=w;S.set('devs',D)};
 ta.oninput=up;up();
 el.querySelectorAll('.dc').forEach(c=>c.onchange=()=>{el.querySelector('#dsc').textContent=el.querySelectorAll('.dc:checked').length+' / 4 critères remplis'})}
function goChap(s,i){cSub=s;cCh=i;cMode='cours';cur='cours';nav();cours();window.scrollTo(0,0)}
function cours(){
 const L=FICHES[cSub];if(cCh>=L.length)cCh=0;
 const done=S.get('done',{}),key=cSub+cCh,title=L[cCh][0],html=DEEP[key]||L[cCh][1];
 const modes=[['cours','Cours'],['exo','Exercices'],['dev','Devoir'],['exp','Explique-moi']];
 $('main').innerHTML=`<div class='flex gap-2 overflow-x-auto pb-3'>${chips(SK,cSub)}</div>
 <section class='card mb-3'><h2 class='hd font-bold mb-2'>Chapitres de ${SUBJ[cSub][0]} (${L.filter((c,i)=>done[cSub+i]).length}/${L.length} lus)</h2><div class='flex flex-wrap gap-2'>${L.map((c,i)=>`<button class='chip ${i===cCh?'on':''}' data-ch='${i}'>${done[cSub+i]?'✓ ':''}${c[0]}</button>`).join('')}</div></section>
 <div class='flex gap-2 overflow-x-auto pb-3'>${modes.map(m=>`<button class='chip ${m[0]===cMode?'on':''}' data-m='${m[0]}'>${m[1]}</button>`).join('')}</div>
 <article class='card fiche'><p class='mut text-sm'>Chapitre ${cCh+1} sur ${L.length}</p><h3 class='hd font-bold text-xl'>${title}</h3><div class='flex flex-wrap gap-2 my-2'>${['Série L2','coef '+SUBJ[cSub][1],'lecture '+Math.max(1,Math.round(html.replace(/<[^>]+>/g,' ').split(/\s+/).filter(Boolean).length/200))+' min',EXO[key]?'exercices rédigés':'exercices guidés',done[key]?'lu':'à lire'].map(t=>`<span style='font-size:.75rem;padding:.2rem .6rem;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut)'>${t}</span>`).join('')}</div><div id='cb'></div></article><section id='nt' class='card mt-3'></section>
 <div class='mt-3 flex flex-wrap gap-2'><button class='btn alt' id='cp'>Chapitre précédent</button><button class='btn' id='cd2'>${done[key]?'Marqué comme lu':'Marquer comme lu'}</button><button class='btn alt' id='cn'>Chapitre suivant</button></div>`;
 const cb=$('cb');notesView($('nt'),key);
 if(cMode==='cours')cb.innerHTML=html;else if(cMode==='exp')cb.innerHTML=explain(html);else if(cMode==='exo')exoView(cb,key,title,html);else devView(cb,key,title);
 if(cMode==='cours'){blocks(cb);miniQuiz(cb,cSub,cCh)}
 bindChips(k=>{cSub=k;cCh=0;cours()});
 $('main').querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{cCh=+b.dataset.ch;cours();window.scrollTo(0,0)});
 $('main').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{cMode=b.dataset.m;cours()});
 $('cp').onclick=()=>{cCh=(cCh-1+L.length)%L.length;cours();window.scrollTo(0,0)};
 $('cn').onclick=()=>{cCh=(cCh+1)%L.length;cours();window.scrollTo(0,0)};
 $('cd2').onclick=()=>{const d=S.get('done',{});d[key]=!d[key];S.set('done',d);cours()};
}
function testV(){const Q=QUIZ[tSub],r=S.get('tests',{})[tSub];
 $('main').innerHTML=`<div class='flex gap-2 overflow-x-auto pb-3'>${chips(SK,tSub)}</div><section class='card'><h2 class='hd text-lg font-bold'>Test de niveau : ${SUBJ[tSub][0]}</h2><p class='mut my-2'>${Q.length} questions courtes. À la fin, vous voyez quels chapitres revoir en premier.</p>${r?`<p class='mb-2'>Dernier résultat : ${r.s} / ${r.t}</p>`:''}<button class='btn' id='ts'>Commencer le test</button></section>`;
 bindChips(k=>{tSub=k;testV()});$('ts').onclick=testRun}
function testRun(){const Q=QUIZ[tSub].map((q,i)=>({q,c:QCH[tSub][i]})).sort(()=>Math.random()-.5);let n=0,ok=0;const weak=[];
 const step=()=>{if(n>=Q.length)return end();const o=Q[n];
 $('main').innerHTML=`<section class='card'><p class='mut text-sm'>Question ${n+1} sur ${Q.length}</p><p class='font-semibold my-2'>${o.q[0]}</p>${o.q[1].map((t,j)=>`<button class='opt' data-j='${j}'>${t}</button>`).join('')}<p class='mut text-sm' id='fb'></p><button class='btn mt-2' id='nx' hidden>Suivant</button></section>`;
  let a=false;$('main').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(a)return;a=true;const j=+b.dataset.j;if(j===o.q[2])ok++;else weak.push(o.c);
   $('main').querySelectorAll('.opt').forEach((x,k)=>{if(k===o.q[2])x.classList.add('ok');else if(k===j)x.classList.add('ko')});$('fb').textContent=o.q[3];$('nx').hidden=false});
  $('nx').onclick=()=>{n++;step()}};
 const end=()=>{const p=ok/Q.length,w=[...new Set(weak)];const T=S.get('tests',{});T[tSub]={s:ok,t:Q.length,weak:w};S.set('tests',T);
 $('main').innerHTML=`<section class='card'><h2 class='hd text-xl font-bold'>Résultat : ${ok} / ${Q.length}</h2><p class='my-2'>${p>=.8?'Niveau solide : passez aux exercices Bac difficile.':p>=.5?'Niveau à consolider : reprenez les chapitres ci-dessous.':'À reprendre : commencez par les chapitres ci-dessous.'}</p>${w.length?`<p class='mut'>Chapitres à revoir en premier :</p><div class='flex flex-wrap gap-2 mt-2'>${w.map(c=>`<button class='chip' data-g='${c}'>${FICHES[tSub][c][0]}</button>`).join('')}</div>`:'<p>Aucun chapitre faible repéré.</p>'}<button class='btn alt mt-3' id='tr'>Refaire un test</button></section>`;
 $('main').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>goChap(tSub,+b.dataset.g));$('tr').onclick=testV};
 step()}
function carnet(){const done=S.get('done',{}),T=S.get('tests',{}),D=S.get('devs',{}),B=S.get('best',{});let tot=0,dn=0;
 const rows=SK.map(k=>{const n=FICHES[k].length,d=FICHES[k].filter((c,i)=>done[k+i]).length;tot+=n;dn+=d;const t=T[k];const dv=Object.keys(D).filter(x=>x.startsWith(k)&&D[x]>30).length;
 return `<section class='card mb-3'><h3 class='hd font-bold'>${SUBJ[k][0]} <span class='mut text-sm'>coef ${SUBJ[k][1]}</span></h3><div style='height:8px;background:var(--line);border-radius:99px;margin:.5rem 0'><div style='height:8px;width:${Math.round(100*d/n)}%;background:var(--acc);border-radius:99px'></div></div><p class='mut text-sm'>${d}/${n} chapitres lus · ${dv} devoir(s) rédigé(s) · quiz : ${B[k]!==undefined?B[k]+'/'+QUIZ[k].length:'–'}</p><p class='mt-1'>${t?`Test de niveau : ${t.s}/${t.t}`:'Pas encore de test de niveau.'}</p>${t&&t.weak.length?`<div class='flex flex-wrap gap-2 mt-2'>${t.weak.map(c=>`<button class='chip' data-s='${k}' data-g='${c}'>À revoir : ${FICHES[k][c][0]}</button>`).join('')}</div>`:''}</section>`}).join('');
 $('main').innerHTML=cheminHtml()+`<section class='card mb-3'><h2 class='hd text-lg font-bold'>Votre progression</h2><p class='hd text-3xl font-bold' style='color:var(--acc)'>${Math.round(100*dn/tot)} %</p><p class='mut text-sm'>${dn} chapitres lus sur ${tot}</p></section>`+rows;
 $('main').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>goChap(b.dataset.s,+b.dataset.g))}
EXO.philo0=[[['Que signifient les mots qui composent « philosophie » ?','Philein (aimer) et sophia (sagesse) : l’amour de la sagesse. Le philosophe cherche la vérité sans prétendre la posséder.'],['Que signifie le passage du mythos au logos ?','On passe d’un récit sacré qu’on croit à un discours qui donne des raisons qu’on peut discuter.']],
[['Distinguez la philosophie et la science.','La science étudie un objet précis, par l’expérience, pour établir des lois. La philosophie pose des questions générales (la vérité, la liberté) et réfléchit sur les fondements de la science. Exemple : le médecin soigne, le philosophe s’interroge sur ce qu’est la vie ou la santé.']],
[['Sujet : La philosophie est-elle utile ? Proposez un plan.','I. Elle paraît inutile (pas de résultat mesurable, débats sans fin). II. Elle est utile : esprit critique, liberté de pensée (Kant, Épicure). III. Dépassement : une utilité d’un autre ordre, elle rend libre et soutient la démocratie.']],
[['Rédigez l’introduction de : « Existe-t-il une philosophie africaine ? »','Amorce : l’histoire de la philosophie est souvent racontée à partir de la Grèce. Sujet reformulé. Problématique : la sagesse transmise par les traditions est-elle une philosophie, ou la philosophie exige-t-elle une réflexion critique écrite ? Plan : I. ethnophilosophie (Tempels, Kagame) ; II. critique (Hountondji, Towa) ; III. dépassement (Oruka, Diagne).']]];
EXO.philo2=[[['Citez les trois instances de la seconde topique freudienne.','Le ça (pulsions), le surmoi (interdits intériorisés), le moi (médiateur avec la réalité).'],['Qu’est-ce que le refoulement ?','Repousser hors de la conscience un désir ou un souvenir inacceptable ; il reste actif dans l’inconscient.']],
[['Expliquez en quoi le rêve est, selon Freud, l’accomplissement déguisé d’un désir refoulé.','Pendant le sommeil, la censure est affaiblie ; le désir refoulé s’exprime mais déformé pour passer la censure. On distingue le contenu manifeste (le rêve raconté) et le contenu latent (le désir caché) que l’interprétation cherche à retrouver.']],
[['Sujet : L’inconscient est-il un obstacle à la liberté ? Proposez un plan.','I. Oui : nos actes sont déterminés par des motifs ignorés (Freud, Spinoza). II. Non : la conscience et le choix demeurent (Sartre, mauvaise foi). III. Dépassement : la liberté est une conquête qui passe par la connaissance de l’inconscient (la cure).']],
[['Rédigez la conclusion de : « Peut-on se mentir à soi-même ? »','Bilan : Freud montre qu’une part de nous nous échappe, Sartre que se mentir suppose de savoir. Réponse : on se ment sous forme de fuite ou de mauvaise foi, jamais complètement. Ouverture : la lucidité est un travail moral continu.']]];
function cheminHtml(){const N=S.get('notes',{}),C=S.get('coefs',{});let tc=0,t=0;const R=[];
 Object.keys(N).forEach(k=>{if(!SUBJ[k])return;const co=+(C[k]??SUBJ[k][1])||0,v=Math.min(20,Math.max(0,parseFloat(N[k])));if(isNaN(v)||!co)return;tc+=co;t+=v*co;R.push({k,co,v})});
 const head="<section class='card mb-3'><h2 class='hd text-lg font-bold'>Chemin vers 20</h2>";
 if(!tc)return head+"<p class='mut'>Saisissez vos notes dans le calculateur du tableau de bord pour voir où gagner des points.</p></section>";
 const avg=t/tc;R.forEach(r=>r.pts=r.co*(20-r.v)/tc);R.sort((a,b)=>b.pts-a.pts);
 return head+`<p class='hd text-3xl font-bold' style='color:var(--acc)'>${avg.toFixed(1).replace('.',',')}<span class='mut text-lg'> / 20</span></p><p class='mut text-sm'>${(20-avg).toFixed(1).replace('.',',')} points à aller chercher</p><div style='height:12px;background:var(--line);border-radius:99px;margin:.6rem 0'><div style='height:12px;width:${Math.round(avg/20*100)}%;background:var(--acc);border-radius:99px'></div></div><p class='font-semibold mt-2'>Où gagner le plus de points :</p><ul class='mt-1'>${R.filter(r=>r.pts>0).slice(0,4).map(r=>`<li style='display:flex;justify-content:space-between;gap:.5rem;padding:.2rem 0'><span>${SUBJ[r.k][0]} <span class='mut text-sm'>coef ${r.co}, note ${String(r.v).replace('.',',')}</span></span><b style='color:var(--acc)'>+${r.pts.toFixed(2).replace('.',',')} pt</b></li>`).join('')}</ul>${histoSvg()}<p class='mut text-xs mt-2'>Ce n’est pas une note du Bac, seulement un repère de travail calculé avec vos notes et vos coefficients.</p></section>`}
EXO.philo3=[[['Que signifie « le regard d’autrui » chez Sartre ?','Sous le regard d’autrui je me découvre objet jugé : cela provoque la honte et montre que je dépends d’autrui pour me connaître.'],['Qu’est-ce que l’ethnocentrisme ?','Juger les autres cultures à partir de la sienne et rejeter comme barbare ce qui est différent (Lévi-Strauss).']],
[['Expliquez la formule de Kant : traiter l’humanité comme une fin et jamais seulement comme un moyen.','Chaque personne a une dignité qui ne se réduit pas à son utilité. On peut utiliser les services d’autrui (un médecin, un commerçant) mais sans oublier qu’il est une personne. Exemple : l’esclavage ou l’exploitation traitent l’homme seulement comme un outil.']],
[['Sujet : Puis-je me connaître sans autrui ? Proposez un plan.','I. Oui : introspection, conscience de soi (Descartes). II. Non : le regard et la reconnaissance d’autrui me révèlent (Sartre, Hegel). III. Dépassement : je me connais dans l’échange et le dialogue, la connaissance de soi est relationnelle.']],
[['Rédigez l’introduction de : « Autrui est-il un obstacle à ma liberté ? »','Amorce : nous vivons toujours avec les autres. Sujet reformulé. Problématique : si autrui me limite, il me permet aussi de me construire : est-il obstacle ou condition de ma liberté ? Plan : I. le conflit (Sartre, Hobbes) ; II. la reconnaissance (Hegel, Aristote) ; III. le respect mutuel (Kant, Lévinas).']]];
function histoSvg(){const H=S.get('hist',{}),K=Object.keys(H).sort();
 if(K.length<2)return "<p class='mut text-sm mt-3'>La courbe de votre moyenne apparaîtra dès la deuxième semaine de saisie.</p>";
 const W=300,Hh=110,p=22,pts=K.map((k,i)=>[p+i*(W-2*p)/(K.length-1),Hh-p-(H[k]/20)*(Hh-2*p)]);
 return `<svg viewBox='0 0 ${W} ${Hh}' style='width:100%;margin-top:.6rem' role='img' aria-label='Évolution de la moyenne'><line x1='${p}' y1='${Hh-p}' x2='${W-p}' y2='${Hh-p}' stroke='var(--line)'/><polyline fill='none' stroke='var(--acc)' stroke-width='2.5' points='${pts.map(q=>q.join(',')).join(' ')}'/>${pts.map((q,i)=>`<circle cx='${q[0]}' cy='${q[1]}' r='3' fill='var(--card)' stroke='var(--acc)' stroke-width='2'><title>${K[i]} : ${H[K[i]]}/20</title></circle>`).join('')}<text x='${p}' y='${Hh-6}' font-size='9' fill='var(--mut)'>${K[0].slice(5)}</text><text x='${W-p}' y='${Hh-6}' font-size='9' text-anchor='end' fill='var(--mut)'>${K[K.length-1].slice(5)}</text></svg><p class='mut text-xs'>Moyenne semaine par semaine (0 à 20).</p>`}
const COL={yellow:'#f2c94c',green:'#4cc38a',blue:'#5aa9e6',pink:'#f08cb0'};
function notesView(el,key,col){col=col||'yellow';const A=S.get('notes2',{}),N=A[key]||[],F=S.get('fav',{});
