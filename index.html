const PAP0={t:"La conscience et l’inconscient",
rapide:`<div class="tip"><b>Accroche.</b> Quand tu conduis une moto ou que tu marches jusqu’au lycée sans réfléchir à chaque pas, est-ce ta ${lx("conscience","conscience")} qui te guide, ou une habitude inconsciente ?</div><h4>L’essentiel en 3 phrases</h4><ol style="list-style:decimal;padding-left:1.2rem"><li>La conscience permet à l’homme d’être présent à lui-même et à ses actes (Descartes).</li><li>Freud montre que nous ne maîtrisons pas tout : l’${lx("inconscient","inconscient")} abrite des désirs ${lx("refoulés","refoulement")}.</li><li>Enjeu au BAC : l’homme est-il maître de lui-même ou le jouet de forces cachées ?</li></ol><p class="mut text-sm">Passe le curseur (ou touche) sur les mots soulignés pour voir leur définition.</p>`,
appro:`<h4>Définitions</h4><ul><li>${lx("Conscience","conscience")} : connaissance immédiate de soi, de ses pensées et du monde.</li><li>${lx("Inconscient","inconscient")} : ce qui agit en nous sans que nous le sachions.</li></ul><h4>Thèse 1 : la conscience fonde la liberté</h4><p>Descartes part du ${lx("cogito","cogito")} : même en doutant de tout, je ne peux douter que je pense. La conscience est la première certitude. Sartre prolonge : « l’existence précède l’essence », l’homme n’a pas de nature fixée d’avance et se définit par ses choix ; il est « condamné à être libre ».</p><h4>Thèse 2 : la conscience a des limites</h4><p>Freud écrit que le moi n’est pas « maître dans sa propre maison » : rêves, lapsus et actes manqués trahissent des désirs refoulés. Exemple concret : tu dis « bonne nuit » à ton professeur au lieu de « bonne journée » sans le vouloir.</p><h4>Exemples de la vie courante</h4><ul><li>Marcher ou conduire sans y penser : l’habitude agit à la place de l’attention.</li><li>Une peur sans raison apparente : souvenir oublié qui continue d’agir.</li></ul><div class="tip"><b>À retenir.</b> Descartes : je suis certain de ce que je pense. Freud : je ne sais pas tout de ce que je pense.</div>`,
methode:`<h4>Ce qu’un correcteur attend</h4><div class="cmp"><div class="no"><b>Ce qu’il faut éviter</b><p>« Freud dit que l’homme n’est pas libre parce que l’inconscient commande tout. »</p><p class="mut text-sm">Défaut : affirmation simpliste et trop catégorique.</p></div><div class="yes"><b>Ce qu’il faut faire</b><p>« Selon la psychanalyse freudienne, le moi n’est pas maître dans sa propre maison, car des désirs refoulés influencent nos choix conscients. »</p><p class="mut text-sm">Qualité : terminologie exacte et nuance.</p></div></div><h4>Pièges fréquents</h4><ul><li>Réciter le cours sans l’appliquer à la question posée.</li><li>Confondre inconscient et « oubli » ou « distraction ».</li><li>Citer un auteur sans expliquer sa thèse.</li></ul><div class="tip"><b>Méthode.</b> Idée, explication, auteur, exemple, puis lien avec le sujet.</div>`,
steps:[["Étape 1 : Décoder le sujet","<ul><li><b>« Toujours »</b> : y a-t-il des exceptions (folie, contrainte, pulsions) ?</li><li><b>« Responsable »</b> : répondre de ses actes, sur le plan moral et juridique.</li></ul>"],["Étape 2 : La problématique","<p>Si l’homme est libre et conscient, il doit assumer ses actes. Mais si des forces inconscientes ou sociales le dépassent, peut-on encore le juger pleinement responsable ?</p>"],["Étape 3 : Plan détaillé et arguments","<ul><li><b>I. Responsable (thèse)</b> : conscience et libre arbitre (Descartes, Sartre). Exemple : devant la loi, l’ignorance n’est pas une excuse.</li><li><b>II. Limites (antithèse)</b> : inconscient (Freud) et milieu social. Exemple : actes sous la contrainte ou en cas de maladie mentale.</li><li><b>III. Un devoir éthique (synthèse)</b> : reconnaître sa responsabilité, c’est préserver sa dignité.</li></ul>"]],
test:[["Qui fonde sa philosophie sur le cogito ?",["Freud","Descartes","Sartre"],1,"Le cogito « Je pense, donc je suis » est de Descartes."],["Le refoulement est…",["Un oubli volontaire","Le rejet de pensées gênantes dans l’inconscient","Une forme de mémoire"],1,"C’est un mécanisme de défense décrit par Freud."],["Quelle idée est bien nuancée ?",["L’inconscient commande tout","Des désirs refoulés influencent nos choix conscients","La conscience ne sert à rien"],1,"On évite les affirmations trop catégoriques."]]};
Object.assign(LX,{autonomie:"Fait de se donner à soi-même sa loi.",determinisme:"Idée que tout phénomène a des causes qui le rendent nécessaire.",bipolaire:"Monde organisé autour de deux puissances rivales.",procede:"Moyen d’écriture (figure, rythme, champ lexical) qui produit un effet."});
const PAP1={s:"Philosophie",t:"La liberté",x:"« Être libre, est-ce faire ce que l’on veut ? »",
rapide:`<div class="tip"><b>Accroche.</b> Si tu fais tout ce qui te passe par la tête sans jamais réfléchir, es-tu vraiment libre ?</div><h4>L’essentiel en 3 phrases</h4><ol style="list-style:decimal;padding-left:1.2rem"><li>Le libre arbitre est le pouvoir de choisir par soi-même (Descartes).</li><li>Le ${lx("déterminisme","determinisme")} affirme que tout a des causes : Spinoza dit que l’homme se croit libre parce qu’il ignore les causes de ses désirs.</li><li>Pour Sartre, l’homme est condamné à être libre : il est responsable de ses choix.</li></ol>`,
appro:`<h4>Définitions</h4><ul><li>Liberté : absence de contrainte, mais aussi capacité de se gouverner.</li><li>${lx("Autonomie","autonomie")} : se donner sa propre loi (Kant).</li></ul><h4>Thèses</h4><p><b>Spinoza</b> : un enfant croit désirer le lait librement, un ivrogne croit parler librement : tous ignorent les causes de leurs actes. <b>Rousseau</b> : obéir à une loi qu’on s’est prescrite à soi-même, c’est être libre ; obéir à ses seuls appétits, c’est être esclave.</p><div class="tip"><b>À retenir.</b> Liberté ≠ caprice : être libre, c’est choisir avec raison.</div>`,
methode:`<h4>Ce qu’un correcteur attend</h4><div class="cmp"><div class="no"><b>À éviter</b><p>« Être libre, c’est faire tout ce qu’on veut. »</p><p class="mut text-sm">Défaut : confond liberté et caprice.</p></div><div class="yes"><b>À faire</b><p>« Si la liberté se réduit au désir, on dépend de ses pulsions ; Rousseau la lie à l’obéissance à une loi qu’on s’est donnée. »</p><p class="mut text-sm">Qualité : thèse nuancée et appuyée sur un auteur.</p></div></div><h4>Pièges</h4><ul><li>Oublier de définir « libre » et « vouloir ».</li><li>Citer un auteur sans le relier au sujet.</li></ul>`,
steps:[["Étape 1 : Décoder le sujet","<ul><li><b>« Faire ce que l’on veut »</b> : suivre ses désirs, parfois par caprice.</li><li><b>« Libre »</b> : indépendant des contraintes, mais aussi maître de soi.</li></ul>"],["Étape 2 : La problématique","<p>Si la liberté consiste à suivre ses désirs, ne dépend-on pas de ces désirs ? La vraie liberté suppose-t-elle de les maîtriser et de se donner des règles ?</p>"],["Étape 3 : Plan détaillé","<ul><li><b>I.</b> Oui : liberté comme absence de contrainte et libre arbitre (Descartes).</li><li><b>II.</b> Non : désirs et déterminismes nous gouvernent (Spinoza).</li><li><b>III.</b> Autonomie : se donner sa loi (Rousseau, Kant).</li></ul>"]],
test:[["Le déterminisme affirme que…",["Tout phénomène a des causes","L’homme choisit sans cause","Rien n’existe"],0,"Tout phénomène a des causes qui le rendent nécessaire."],["Qui pense que l’homme se croit libre par ignorance des causes ?",["Spinoza","Platon","Sartre"],0,"C’est la thèse de Spinoza."],["Autonomie signifie…",["Se donner à soi-même sa loi","Obéir à autrui","Faire ce qu’on veut"],0,"Autos (soi) et nomos (loi)."]]};
const PAP2={s:"Histoire-Géographie",t:"La guerre froide",x:"Composition : « Le monde bipolaire de 1947 à 1991 »",
rapide:`<div class="tip"><b>Accroche.</b> Pourquoi deux superpuissances qui ne se sont jamais affrontées directement ont-elles tenu le monde en tension pendant plus de 40 ans ?</div><h4>L’essentiel en 3 phrases</h4><ol style="list-style:decimal;padding-left:1.2rem"><li>Après 1945, les États-Unis (capitalisme) et l’URSS (communisme) s’opposent dans un monde ${lx("bipolaire","bipolaire")}.</li><li>La rivalité est indirecte : Berlin, Corée, Cuba, course aux armements.</li><li>Elle s’achève avec la chute du mur en 1989 et la dissolution de l’URSS en 1991.</li></ol>`,
appro:`<h4>Repères</h4><ul><li>1947 : doctrine Truman et plan Marshall.</li><li>1949 : création de l’OTAN ; 1955 : pacte de Varsovie.</li><li>1961 : mur de Berlin ; 1962 : crise de Cuba.</li><li>1989 : chute du mur ; 1991 : dissolution de l’URSS.</li></ul><h4>Et l’Afrique ?</h4><p>La décolonisation s’inscrit dans la guerre froide. En 1955, la conférence de Bandung réunit des pays d’Afrique et d’Asie qui refusent de choisir un bloc (non-alignement).</p>`,
methode:`<h4>Ce qu’un correcteur attend</h4><div class="cmp"><div class="no"><b>À éviter</b><p>« La guerre froide, c’est quand les USA et l’URSS se battent. »</p><p class="mut text-sm">Défaut : faux, il n’y a pas d’affrontement direct.</p></div><div class="yes"><b>À faire</b><p>« La guerre froide est un affrontement idéologique, économique et indirect entre deux blocs, sans guerre ouverte entre eux (1947-1991). »</p><p class="mut text-sm">Qualité : définition précise et datée.</p></div></div><h4>Pièges</h4><ul><li>Dates imprécises ou absentes.</li><li>Oublier le Tiers-Monde.</li><li>Un plan seulement descriptif.</li></ul>`,
steps:[["Étape 1 : Analyser le sujet","<ul><li><b>Bornes</b> : 1947 (doctrine Truman) et 1991 (fin de l’URSS).</li><li><b>« Bipolaire »</b> : deux pôles de puissance rivaux.</li></ul>"],["Étape 2 : La problématique","<p>Comment l’affrontement entre deux blocs a-t-il structuré le monde, et pourquoi s’est-il achevé sans guerre directe ?</p>"],["Étape 3 : Plan détaillé","<ul><li><b>I.</b> La mise en place des blocs (1947-1953).</li><li><b>II.</b> Une rivalité globale : crises, coexistence pacifique, Tiers-Monde.</li><li><b>III.</b> La fin du monde bipolaire (1979-1991).</li></ul>"]],
test:[["Quel événement marque la fin de la division de Berlin en 1989 ?",["La chute du mur","La crise de Cuba","Le blocus de Berlin"],0,"Le mur tombe en novembre 1989."],["L’OTAN est créée en…",["1949","1955","1962"],0,"1949 ; le pacte de Varsovie date de 1955."],["La conférence de Bandung (1955) réunit…",["Des pays d’Afrique et d’Asie","Les deux superpuissances","Des pays européens"],0,"Elle prépare le non-alignement."]]};
const PAP3={s:"Français",t:"Le commentaire composé",x:"Construire les axes d’un commentaire",
rapide:`<div class="tip"><b>Accroche.</b> Devant un poème, tu sens qu’il touche, mais comment expliquer pourquoi ?</div><h4>L’essentiel en 3 phrases</h4><ol style="list-style:decimal;padding-left:1.2rem"><li>Lire le texte et repérer le thème, le ton et les ${lx("procédés","procede")}.</li><li>Regrouper les procédés par idée : ce sont les axes d’étude.</li><li>Rédiger : introduction, 2 à 3 axes avec citations, conclusion.</li></ol>`,
appro:`<h4>Définitions</h4><ul><li><b>Projet de lecture</b> : la question à laquelle le commentaire répond.</li><li><b>Axe</b> : une idée soutenue par plusieurs procédés.</li></ul><h4>Procédés courants</h4><p>Métaphore, comparaison, anaphore, champ lexical, rythme. Chaque paragraphe suit : idée, citation, procédé, interprétation.</p>`,
methode:`<h4>Ce qu’un correcteur attend</h4><div class="cmp"><div class="no"><b>À éviter</b><p>« L’auteur utilise une métaphore. »</p><p class="mut text-sm">Défaut : le procédé est nommé, jamais interprété.</p></div><div class="yes"><b>À faire</b><p>« La métaphore [citation] assimile la douleur à une blessure, ce qui rend sa violence presque physique. »</p><p class="mut text-sm">Qualité : citation, procédé et effet.</p></div></div><h4>Pièges</h4><ul><li>Suivre l’ordre des lignes au lieu de faire des axes.</li><li>Paraphraser le texte.</li></ul>`,
steps:[["Étape 1 : Lire et relever","<p>Repère le thème, le ton et les procédés (figures, champs lexicaux, rythme). Note-les au brouillon avec leurs citations.</p>"],["Étape 2 : Le projet de lecture","<p>Formule une question directrice, par exemple : comment le poète exprime-t-il son émotion ?</p>"],["Étape 3 : Construire les axes","<ul><li><b>I.</b> Une émotion intense (champs lexicaux, ponctuation).</li><li><b>II.</b> Des procédés qui la mettent en valeur (métaphores, rythme).</li></ul>"]],
test:[["Les axes d’étude se construisent en…",["Regroupant les procédés par idée","Suivant l’ordre des lignes","Résumant le texte"],0,"Un axe regroupe des procédés autour d’une idée."],["Quel est un procédé d’écriture ?",["L’anaphore","Le paragraphe","Le titre"],0,"L’anaphore répète un mot en début de phrase ou de vers."],["Le projet de lecture est…",["La question directrice annoncée en introduction","La conclusion","Un résumé"],0,"Il guide tout le commentaire."]]};
const PAPS=[PAP0,PAP1,PAP2,PAP3];let PAP=PAP0,PI=0;
let pT="rapide";
function pap(){const T=[["rapide","Révision rapide"],["appro","Cours approfondi"],["methode","Méthode et pièges"],["test","Auto-test"],["exo","Exercice pas à pas"]],R=S.get("pasr"+PI,0),sc=S.get("pasT"+PI,null);
let body="";
if(pT==="test")body=PAP.test.map((q,i)=>`<div class="my-2"><p><b>${i+1}.</b> ${q[0]}</p>${q[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join("")}<p class="mut text-sm" data-f="${i}"></p></div>`).join("")+`<p class="mut text-sm">${sc!=null?"Dernier score : "+sc+"/3":"Valide ta compréhension avant l’exercice."}</p>`;
else if(pT==="exo")body=sc==null?`<p>Fais d’abord l’auto-test de 3 questions pour valider ta compréhension.</p><div class="flex gap-2 mt-2"><button class="btn" data-go="test">Faire l’auto-test</button><button class="btn alt" data-force="1">Accéder quand même</button></div>`:`<h3 class="hd font-bold">${PAP.x||"« L’homme est-il toujours responsable de ses actes ? »"}</h3><p class="mut text-sm mb-2">Cherche d’abord par toi-même, puis révèle chaque étape.</p>`+PAP.steps.map((s,i)=>`<div class="card my-2"><b>${s[0]}</b>${i<R?`<div class="fiche">${s[1]}</div>`:`<textarea rows="2" class="w-full my-2" placeholder="Ton essai (facultatif)"></textarea><button class="btn" data-r="${i}" ${i>R?"disabled style='opacity:.5'":""}>Révéler l’étape</button>`}</div>`).join("")+(R?`<button class="btn alt" id="pr0">Recommencer</button>`:"");
else body=`<div class="fiche">${PAP[pT]}</div>`;
$("main").innerHTML=`<div class="flex gap-2 overflow-x-auto pb-1">${PAPS.map((c,i)=>`<button class="chip ${i===PI?"on":""}" data-c="${i}">${c.s||"Philosophie"} · ${c.t}</button>`).join("")}</div><div class="tabs my-2">${T.map(t=>`<button class="tab ${t[0]===pT?"on":""}" data-p="${t[0]}">${t[1]}</button>`).join("")}</div><div class="card">${body}</div>`;
const m=$("main");m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{PI=+b.dataset.c;PAP=PAPS[PI];pT="rapide";pap()});m.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pT=b.dataset.p;pap()});
m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{pT="test";pap()});
m.querySelectorAll("[data-force]").forEach(b=>b.onclick=()=>{S.set("pasT"+PI,0);pap()});
m.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.set("pasr"+PI,+b.dataset.r+1);pap()});
if($("pr0"))$("pr0").onclick=()=>{S.set("pasr"+PI,0);pap()};
let got=0,done=0;m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,q=PAP.test[i],g=m.querySelectorAll(`[data-q='${i}']`);if(g[0].disabled)return;g.forEach((o,k)=>{o.disabled=true;if(k===q[2])o.classList.add("ok");else if(k===j)o.classList.add("ko")});m.querySelector(`[data-f='${i}']`).textContent=(j===q[2]?"Bonne réponse. ":"Pas tout à fait. ")+q[3];if(j===q[2])got++;if(++done===3){S.set("pasT"+PI,got);setTimeout(()=>{pT="exo";pap()},1800)}})}
TABS.push(["pap","Pas à pas"]);VIEWS.pap=pap;
/* ===== Exos corrigés : exercices détaillés pour élèves en difficulté ===== */
const EXC=[
{id:'c1',s:'philo',n:'Expliquer une formule',l:'Facile',
q:'Expliquez la formule de Descartes : « Je pense, donc je suis ».',
r:`<p>Descartes cherche une chose dont on ne peut <b>absolument pas</b> douter. Imagine que tu doutes de tout : même en train de douter, <b>tu es bien là</b> pour douter. Donc une chose est sûre : tu existes.</p>`,
st:[['1. Je comprends la consigne',`<p>« Expliquer » = dire ce que la phrase veut dire <b>et</b> pourquoi l’auteur l’affirme. Je me pose 3 questions : <b>qui</b> parle ? <b>dans quel but</b> ? <b>qu’est-ce que ça prouve</b> ?</p>`],
['2. Je rassemble mes idées (brouillon)',`<ul><li><b>Qui</b> : Descartes, philosophe du XVIIᵉ siècle.</li><li><b>But</b> : trouver une vérité absolument certaine pour fonder la connaissance.</li><li><b>Méthode</b> : le doute radical (les sens trompent, on confond rêve et réalité, un « malin génie » pourrait nous tromper).</li><li><b>Découverte</b> : même si je me trompe sur tout, il faut bien que je pense pour me tromper.</li><li><b>Conclusion</b> : la pensée prouve mon existence. C’est le <b>cogito</b>.</li></ul>`],
['3. Je rédige la réponse',`<p>« Cette formule est de Descartes. Il cherche une vérité qui résiste à tous les doutes. Il doute donc de ses sens, des rêves et même des mathématiques. Mais il remarque que, pour douter, il faut penser, et que pour penser, il faut exister. Ainsi, "je pense" prouve "je suis". Cette première certitude, le cogito, devient le point de départ de toute sa philosophie : la pensée est la preuve de l’existence. »</p>`]],
e:`<ul><li>Croire que « je n’existe que quand je pense » : faux, la pensée est la <b>preuve</b>, pas la condition.</li><li>Oublier de parler du <b>doute</b> : sans lui, la formule n’a pas de sens.</li><li>Réciter la formule sans l’expliquer avec ses propres mots.</li></ul>`,
a:`Explique en 6 lignes : « L’existence précède l’essence » (Sartre). Indice : l’essence, c’est ce qu’on est « par nature », comme un couteau fabriqué pour couper.`},
{id:'c2',s:'philo',n:'Construire un plan',l:'Bac normal',
q:'Sujet de dissertation : « Peut-on se connaître soi-même ? »',
r:`<p>Un plan, c’est une réponse en 3 temps : <b>Oui</b> (première idée), <b>Mais non</b> (l’idée contraire), <b>Et alors ?</b> (une solution qui dépasse les deux). Chaque partie contient : une idée, un auteur, un exemple.</p>`,
st:[['1. Je décode le sujet',`<ul><li><b>« Peut-on »</b> : est-ce possible ?</li><li><b>« Se connaître »</b> : savoir qui je suis vraiment (mes désirs, mes qualités, mes limites).</li><li><b>« Soi-même »</b> : par moi seul, sans l’aide des autres.</li></ul>`],
['2. Je trouve la problématique',`<p>Je me crois transparent à moi-même parce que j’ai conscience de mes pensées. Pourtant Freud montre qu’une partie de moi m’échappe. <b>Problématique</b> : la conscience suffit-elle pour se connaître, et sinon, par quelles voies peut-on y parvenir ?</p>`],
['3. Je construis le plan',`<ul><li><b>I. Oui, par la conscience</b> : l’introspection me donne accès à mes pensées (Descartes) ; « Connais-toi toi-même » (Socrate). <i>Exemple</i> : je sais que j’ai peur avant un examen.</li><li><b>II. Non, une part m’échappe</b> : l’inconscient (Freud : le moi « n’est pas maître dans sa propre maison »), le regard déformant de l’amour-propre. <i>Exemple</i> : un lapsus qui trahit ce que je cachais.</li><li><b>III. On se connaît par l’action et les autres</b> : je me découvre par ce que je fais (Sartre), et les autres me renvoient une image de moi. <i>Exemple</i> : c’est en affrontant une difficulté qu’on découvre son courage.</li></ul>`],
['4. J’écris l’introduction',`<p><b>Amorce</b> : « Connais-toi toi-même » était gravé à l’entrée du temple de Delphes. <b>Sujet</b> : cette ancienne maxime suppose qu’on peut se connaître. <b>Problématique</b> : pourtant, la conscience suffit-elle à connaître ce que nous sommes vraiment ? <b>Plan</b> : nous verrons d’abord que la conscience donne accès à soi, puis que l’inconscient limite cette connaissance, enfin que l’action et autrui nous révèlent à nous-mêmes.</p>`]],
e:`<ul><li>Faire un plan « pour / contre » sans lien entre les parties.</li><li>Citer un auteur sans expliquer son idée.</li><li>Une partie III qui répète la partie I.</li></ul>`,
a:`Construis le plan (3 parties avec idée, auteur, exemple) du sujet : « La liberté est-elle une illusion ? »`},
{id:'h1',s:'hg',n:'Expliquer des causes',l:'Facile',
q:'Expliquez les causes de l’éclatement de la Fédération du Mali (août 1960).',
r:`<p>Une « cause » répond à la question <b>pourquoi ?</b>. On ne raconte pas toute l’histoire : on range les raisons en groupes (politique, idéologique, rivalités de pouvoir) et on donne des faits précis.</p>`,
st:[['1. Je place les repères (frise)',`<ul><li>1956 : loi-cadre Defferre. 1958 : référendum.</li><li>Janvier 1959 : naissance de la Fédération du Mali (Sénégal + Soudan français).</li><li>20 juin 1960 : indépendance de la Fédération.</li><li><b>20 août 1960</b> : le Sénégal proclame sa sortie ; la fédération éclate.</li><li>Septembre 1960 : le Soudan devient la République du Mali.</li></ul>`],
['2. Je cherche les causes par groupes',`<ul><li><b>Politique</b> : désaccord sur le type d’État. Le Soudan voulait une fédération forte et centralisée ; le Sénégal, plus d’autonomie.</li><li><b>Idéologique</b> : le Soudan (US-RDA de Modibo Keïta) était plus radical et socialiste ; le Sénégal de Senghor, plus modéré et proche de la France.</li><li><b>Rivalité de pouvoir</b> : tension entre les dirigeants sur la direction de la fédération et sur le choix du chef de l’État fédéral.</li></ul>`],
['3. Je rédige la réponse',`<p>« La Fédération du Mali, formée en 1959 par le Sénégal et le Soudan, éclate le 20 août 1960, deux mois après son indépendance. Les causes sont d’abord politiques : le Soudan veut un État fédéral fort, le Sénégal défend davantage d’autonomie. Elles sont aussi idéologiques : le Soudan est plus radical, le Sénégal plus modéré. Enfin, la rivalité entre Modibo Keïta et Senghor pour la direction de la fédération précipite la rupture. Le Sénégal proclame alors son indépendance. »</p>`]],
e:`<ul><li>Confondre la <b>Fédération du Mali</b> (1959-1960) et le Mali actuel.</li><li>Oublier les dates précises.</li><li>Parler de « guerre » : c’est une crise politique, non un conflit armé.</li></ul>`,
a:`Explique en 5 lignes les causes de la crise de décembre 1962 entre Senghor et Mamadou Dia.`},
{id:'f1',s:'fr',n:'Analyser un procédé',l:'Facile',
q:'Phrase écrite pour l’exercice : « Ma peine est un fleuve sans rive qui coule en moi jour et nuit. » Rédigez un paragraphe de commentaire.',
r:`<p>Un commentaire suit toujours la même formule : <b>Procédé</b> (le nom de la figure) + <b>Citation</b> (les mots du texte) + <b>Effet</b> (ce que ça fait ressentir). Sans l’effet, le paragraphe est incomplet.</p>`,
st:[['1. Je repère le procédé',`<p>« Ma peine <b>est</b> un fleuve » : le verbe « est » relie deux choses sans le mot « comme ». C’est une <b>métaphore</b>. S’il y avait « comme », ce serait une <b>comparaison</b>.</p>`],
['2. Je décode chaque élément',`<ul><li><b>Peine</b> : un sentiment, on ne le voit pas.</li><li><b>Fleuve</b> : grand, puissant, qui ne s’arrête pas.</li><li><b>Sans rive</b> : sans limite, impossible à contenir.</li><li><b>Jour et nuit</b> : continuité, aucune pause.</li></ul>`],
['3. J’écris le paragraphe',`<p>« Le poète exprime l’ampleur de sa douleur. La métaphore "Ma peine est un fleuve sans rive" assimile le chagrin à un fleuve immense et sans limites. Elle rend la douleur visible et presque impossible à arrêter. L’expression "jour et nuit" renforce cette idée : la souffrance ne connaît aucun repos. »</p>`]],
e:`<ul><li>Écrire seulement « L’auteur utilise une métaphore » sans dire l’effet.</li><li>Confondre métaphore et comparaison.</li><li>Répéter la phrase avec d’autres mots (paraphrase) au lieu de l’interpréter.</li></ul>`,
a:`Analyse : « Sa colère éclata comme un orage. » Quel procédé ? Quel effet ? Écris 3 lignes.`},
{id:'e1',s:'eco',n:'Croissance nominale et réelle',l:'Facile',
q:'Le PIB nominal est de 8 000 milliards de F CFA en 2022 et 8 400 en 2023. L’indice des prix passe de 100 à 105. 1) Calculez le taux de croissance nominal. 2) Le taux d’inflation. 3) Le PIB réel 2023 et la croissance réelle.',
r:`<p>Le PIB <b>nominal</b> est compté avec les prix du jour : si les prix montent, il monte même sans production en plus. Le PIB <b>réel</b> enlève l’effet des prix pour mesurer la vraie production.</p>`,
st:[['1. Je choisis la formule',`<p><b>Taux de variation</b> = (valeur finale − valeur initiale) ÷ valeur initiale × 100.</p>`],
['2. Questions 1 et 2',`<ul><li>Croissance nominale = (8 400 − 8 000) ÷ 8 000 × 100 = 400 ÷ 8 000 × 100 = <b>5 %</b>.</li><li>Inflation = (105 − 100) ÷ 100 × 100 = <b>5 %</b>.</li></ul>`],
['3. Question 3 : PIB réel',`<p>PIB réel 2023 = PIB nominal ÷ indice des prix × 100 = 8 400 ÷ 105 × 100 = <b>8 000 milliards</b> (aux prix de 2022). Croissance réelle = (8 000 − 8 000) ÷ 8 000 × 100 = <b>0 %</b>.</p>`],
['4. J’interprète',`<p>Le PIB nominal augmente de 5 %, mais les prix augmentent aussi de 5 % : le pays n’a <b>pas produit plus</b>. La hausse est seulement apparente.</p>`]],
e:`<ul><li>Diviser par la valeur finale au lieu de la valeur initiale.</li><li>Oublier de multiplier par 100.</li><li>Confondre PIB nominal et PIB réel.</li></ul>`,
a:`PIB nominal : 5 000 puis 5 600 ; indice des prix : 100 puis 104. Calcule la croissance nominale, le PIB réel et la croissance réelle (≈ 7,7 %).`},
{id:'m1',s:'maths',n:'Étude d’une fonction',l:'Bac normal',
q:'Soit f(x) = x² − 4x + 3. 1) Trouvez les racines. 2) Calculez f′(x) et étudiez les variations. 3) Donnez le minimum.',
r:`<p>La <b>dérivée</b> mesure la pente de la courbe. Pente négative : la courbe descend. Pente positive : elle monte. Quand la pente vaut 0, la courbe change de sens (sommet).</p>`,
st:[['1. Les racines : résoudre f(x) = 0',`<ul><li>a = 1, b = −4, c = 3.</li><li>Δ = b² − 4ac = 16 − 12 = <b>4</b> (positif : deux racines).</li><li>x₁ = (4 − 2) ÷ 2 = <b>1</b> et x₂ = (4 + 2) ÷ 2 = <b>3</b>.</li></ul>`],
['2. La dérivée',`<p>f′(x) = 2x − 4. On cherche quand elle s’annule : 2x − 4 = 0 donc x = 2.</p>`],

['4. Je conclus',`<p>f décroît sur ]−∞ ; 2], croît sur [2 ; +∞[ et admet un <b>minimum égal à −1</b>, atteint en x = 2. Le sommet de la parabole est S(2 ; −1).</p>`]],
